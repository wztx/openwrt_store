# 用户可利用此run单独升级最新版hysteria内核
name: hysteria Openwrt24-25版本

on:
  schedule:
    - cron: "11 22 * * *"  # 北京时间早上 6 点 11
  workflow_dispatch:

# 防止定时任务与手动触发并发执行导致提交冲突
concurrency:
  group: hysteria-repo-build
  cancel-in-progress: false

permissions:
  contents: write   # 允许推送到本仓库
  actions: write    # 允许清理本仓库的 Actions 运行缓存

jobs:
  build:
    name: 构建hysteria并提交到本仓库
    runs-on: ubuntu-26.04

    steps:
      - name: 拉取存储库（获取完整历史记录）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      

      - name: 从Hysteria获取最新的发行标签
        id: fetch_latest_tag
        run: |
          # hysteria 的 tag 格式为 app/vX.Y.Z，且均为正式版（prerelease=false）
          latest_tag=$(curl -s https://api.github.com/repos/HyNetworks/hysteria/releases \
          | jq -r 'sort_by(.published_at) | reverse | map(select(.prerelease==false)) | .[0].tag_name')
          # 去掉 app/ 前缀得到纯版本号，用于文件名和显示
          version=$(echo "$latest_tag" | sed 's|^app/||')
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "最新版本:$latest_tag (纯版本号:$version)"

      - name: 检查版本是否已存在
        id: check_version
        run: |
          x86_file="run/x86/hysteria-core_${VERSION}_x86_64.run"
          arm64_file="run/arm64/hysteria-core_${VERSION}_aarch64_a53.run"
          
          if [ -f "$x86_file" ] && [ -f "$arm64_file" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "仓库中已存在 ${VERSION} 版本的两个架构文件，跳过本次构建"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "检测到新版本 ${VERSION}，开始构建"
          fi

      - name: 克隆存储库
        if: steps.check_version.outputs.skip != 'true'
        run: git clone https://github.com/megastep/makeself.git

      - name: 下载最新hysteria文件
        if: steps.check_version.outputs.skip != 'true'
        run: |
          mkdir -p x86 x86-pre arm64 arm64-pre

          # 下载hysteria x86 (linux amd64)
          wget -O x86-pre/hysteria-linux-amd64 https://github.com/HyNetworks/hysteria/releases/download/${LATEST_TAG}/hysteria-linux-amd64
          chmod +x x86-pre/hysteria-linux-amd64
          cp -f x86-pre/hysteria-linux-amd64 x86/hysteria
          
          # 下载hysteria arm64 (linux arm64)
          wget -O arm64-pre/hysteria-linux-arm64 https://github.com/HyNetworks/hysteria/releases/download/${LATEST_TAG}/hysteria-linux-arm64
          chmod +x arm64-pre/hysteria-linux-arm64
          cp -f arm64-pre/hysteria-linux-arm64 arm64/hysteria


      - name: 创建install.sh脚本
        if: steps.check_version.outputs.skip != 'true'
        run: |
          cat <<EOF > x86/install.sh
          #!/bin/sh
          opkg update
          if [ $? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          opkg install hysteria
          chmod +x hysteria
          cp hysteria /usr/bin/hysteria
          echo "Hysteria 已经更新到 v${VERSION}"
          EOF
          chmod +x x86/install.sh
          cp x86/install.sh arm64/install.sh

      - name: 将hysteria目录移至makeelf
        if: steps.check_version.outputs.skip != 'true'
        run: |
          mv x86 makeself/
          mv arm64 makeself/

      - name: 创建自解压包
        if: steps.check_version.outputs.skip != 'true'
        run: |
          cd makeself
          ./makeself.sh x86/ hysteria-core_${VERSION}_x86_64.run "hysteria core ${VERSION} by github action" ./install.sh
          ./makeself.sh arm64/ hysteria-core_${VERSION}_aarch64_a53.run "hysteria core ${VERSION} by github action" ./install.sh

      - name: 检查文件大小
        if: steps.check_version.outputs.skip != 'true'
        run: |
          ls -lh makeself/hysteria-core_*.run

      - name: 提交更新并推送更新到仓库
        if: steps.check_version.outputs.skip != 'true'
        run: |
          # 配置 git 用户
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 创建目标目录
          mkdir -p run/x86 run/arm64

          # 只删除本脚本构建的 hysteria-core 旧版本文件（精确匹配前缀，不删除其它文件）
          rm -f run/x86/hysteria-core_*.run
          rm -f run/arm64/hysteria-core_*.run

          # 将新构建的 run 文件复制到对应目录
          cp -f makeself/hysteria-core_${VERSION}_x86_64.run run/x86/
          cp -f makeself/hysteria-core_${VERSION}_aarch64_a53.run run/arm64/

          # 提交并推送
          git add -f run/x86/hysteria-core_*.run run/arm64/hysteria-core_*.run
          git commit -m "feat: update hysteria run files to ${VERSION}

          Auto-generated by GitHub Actions on $(date -u -d '+8 hour' +'%Y-%m-%d %H:%M:%S') CST
          - x86_64:  run/x86/hysteria-core_${VERSION}_x86_64.run
          - aarch64: run/arm64/hysteria-core_${VERSION}_aarch64_a53.run" || echo "No changes to commit."

          git push origin HEAD:${{ github.ref_name }}

      - name: 清理运行缓存
        if: always()
        run: |
          echo "===== 清理运行缓存 ====="
          # 删除 makeself 仓库及构建中间产物
          rm -rf makeself
          # 删除临时下载目录
          rm -rf x86-pre arm64-pre
          # 同步清理构建时残留的临时文件
          rm -f *.tmp *.log
          echo "缓存清理完成"
          echo "仓库当前 run 目录结构："
          ls -lhR run/ 2>/dev/null || echo "run 目录已保留"
