name: 自动更新 mosdns IPK 软件包

on:
  schedule:
    - cron: '34 22 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: '强制更新（覆盖已存在的 IPK）'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_API: https://api.github.com/repos/sbwml/luci-app-mosdns/releases
  PKG_NAME: mosdns
  TZ: Asia/Shanghai
  ARCH_MATRIX: |
    [
      {
        "arch": "x86_64",
        "asset_glob": "x86_64-openwrt-24.10.tar.gz",
        "dest_dir": "run/x86_64/luci-app-mosdns"
      },
      {
        "arch": "aarch64",
        "asset_glob": "aarch64_generic-openwrt-*.tar.gz",
        "dest_dir": "run/aarch64/luci-app-mosdns"
      }
    ]
  EXTRACT_PATTERNS: |
    mosdns_*.ipk
    luci-i18n-mosdns-zh-cn_*.ipk
    luci-app-mosdns_*.ipk
    geo2txt_*.ipk
  CLEAN_PATTERNS: |
    mosdns_
    luci-i18n-mosdns-zh-cn_
    luci-app-mosdns_
    geo2txt_
  COMMIT_MSG_TEMPLATE: "🔄自动更新 ${PKG_NAME} ${VERSION} | ${BUILD_TIME}(北京时间)"

jobs:
  update-mosdns-ipk:
    name: 自动更新 mosdns IPK 软件包
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 获取上游最新版本号
        run: |
          echo "==> 获取上游最新版本号 开始"
          python3 - <<'PYEOF'
          import json, urllib.request, os
          api = os.environ["UPSTREAM_API"]
          print(f"==> 请求上游 API: {api}")
          req = urllib.request.Request(api, headers={"User-Agent": "mosdns-ipk-updater"})
          with urllib.request.urlopen(req) as resp:
              releases = json.load(resp)
          releases = [r for r in releases if not r.get("draft")]
          releases.sort(key=lambda r: r.get("published_at", ""), reverse=True)
          release = releases[0]
          tag = release["tag_name"]
          version = tag[1:] if tag.startswith("v") else tag
          print(f"==> 最新 tag: {tag}，解析版本号: {version}")
          with open("/tmp/mosdns-release.json", "w", encoding="utf-8") as f:
              json.dump(release, f, ensure_ascii=False)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"VERSION={version}\n")
          PYEOF
          echo "==> 获取上游最新版本号 完成"

      - name: 读取触发参数
        run: |
          echo "==> 读取触发参数 开始"
          FORCE_UPDATE="${{ github.event.inputs.force_update || 'false' }}"
          echo "FORCE_UPDATE=$FORCE_UPDATE" >> "$GITHUB_ENV"
          echo "==> 强制更新: $FORCE_UPDATE"
          echo "==> 读取触发参数 完成"

      - name: 解析下载任务
        run: |
          echo "==> 解析下载任务 开始"
          python3 - <<'PYEOF'
          import json, os, fnmatch
          matrix = json.loads(os.environ["ARCH_MATRIX"])
          with open("/tmp/mosdns-release.json", encoding="utf-8") as f:
              release = json.load(f)
          assets = release.get("assets", [])
          plan = []
          for item in matrix:
              matches = [a for a in assets if fnmatch.fnmatch(a["name"], item["asset_glob"])]
              if not matches:
                  print(f"错误：未找到匹配资产 {item['asset_glob']}，跳过 {item['arch']}")
                  continue
              matches.sort(key=lambda a: a.get("updated_at", ""), reverse=True)
              asset = matches[0]
              plan.append({
                  "arch": item["arch"],
                  "asset": asset["name"],
                  "url": asset["browser_download_url"],
                  "dest_dir": item["dest_dir"]
              })
          with open("/tmp/mosdns-download-plan.json", "w", encoding="utf-8") as f:
              json.dump(plan, f, ensure_ascii=False)
          with open("/tmp/mosdns-plan.txt", "w", encoding="utf-8") as f:
              for item in plan:
                  f.write(f"{item['arch']}\t{item['asset']}\t{item['url']}\t{item['dest_dir']}\n")
          print(f"==> 下载计划: {json.dumps(plan, ensure_ascii=False)}")
          if not plan:
              raise SystemExit("错误：没有可下载的资产")
          PYEOF
          echo "==> 解析下载任务 完成"

      - name: 下载并解压上游资产
        run: |
          echo "==> 下载并解压上游资产 开始"
          while IFS=$'\t' read -r ARCH ASSET DOWNLOAD_URL DEST_DIR; do
            [ -n "$ARCH" ] || continue
            echo "==> 处理架构: $ARCH"
            echo "==> 资产: $ASSET"
            echo "==> 下载 URL: $DOWNLOAD_URL"

            mkdir -p "/tmp/mosdns-build/$ARCH" || exit 1
            curl -L -H "User-Agent: mosdns-ipk-updater" \
              -o "/tmp/mosdns-build/$ARCH/$ASSET" "$DOWNLOAD_URL" || exit 1

            [ -s "/tmp/mosdns-build/$ARCH/$ASSET" ] || {
              echo "错误：下载文件为空: /tmp/mosdns-build/$ARCH/$ASSET" >&2
              exit 1
            }

            mkdir -p "/tmp/mosdns-extract/$ARCH" || exit 1
            tar -xzf "/tmp/mosdns-build/$ARCH/$ASSET" -C "/tmp/mosdns-extract/$ARCH" || exit 1
            echo "==> 解压完成: /tmp/mosdns-extract/$ARCH"
          done < /tmp/mosdns-plan.txt
          echo "==> 下载并解压上游资产 完成"

      - name: 提取 IPK 并复制到目标目录
        run: |
          echo "==> 提取 IPK 并复制到目标目录 开始"
          while IFS=$'\t' read -r ARCH ASSET DOWNLOAD_URL DEST_DIR; do
            [ -n "$ARCH" ] || continue
            echo "==> 处理架构: $ARCH，目标目录: $DEST_DIR"
            mkdir -p "$DEST_DIR" || exit 1

            while IFS= read -r pattern; do
              [ -n "$pattern" ] || continue
              while IFS= read -r ipk; do
                [ -n "$ipk" ] || continue
                [ -s "$ipk" ] || {
                  echo "错误：IPK 文件为空: $ipk" >&2
                  exit 1
                }
                base=$(basename "$ipk")
                target="$DEST_DIR/$base"

                if [ -f "$target" ] && [ "$FORCE_UPDATE" != "true" ]; then
                  echo "==> 已存在，跳过: $target"
                  continue
                fi

                cp -f "$ipk" "$target" || exit 1
                echo "==> 已复制: $target"
              done < <(find "/tmp/mosdns-extract/$ARCH" -type f -name "$pattern" -print)
            done <<< "$EXTRACT_PATTERNS"
          done < /tmp/mosdns-plan.txt
          echo "==> 提取 IPK 并复制到目标目录 完成"

      - name: 清理旧版本文件
        run: |
          echo "==> 清理旧版本文件 开始"
          while IFS=$'\t' read -r ARCH ASSET DOWNLOAD_URL DEST_DIR; do
            [ -n "$ARCH" ] || continue
            echo "==> 清理架构: $ARCH，目录: $DEST_DIR"

            while IFS= read -r prefix; do
              [ -n "$prefix" ] || continue
              for f in "$DEST_DIR/${prefix}"*.ipk; do
                [ -e "$f" ] || continue
                base=$(basename "$f")

                if find "/tmp/mosdns-extract/$ARCH" -type f -name "$base" -print -quit | grep -q .; then
                  echo "==> 保留本次文件: $f"
                  continue
                fi

                rm -f "$f"
                echo "==> 已删除旧文件: $f"
              done
            done <<< "$CLEAN_PATTERNS"
          done < /tmp/mosdns-plan.txt
          echo "==> 清理旧版本文件 完成"

      - name: 提交并推送
        run: |
          echo "==> 提交并推送 开始"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add run/
          if git diff --cached --quiet; then
            echo "==> 无变更，跳过提交"
          else
            BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
            # 用 sed 显式替换占位符，避免 eval 对 |、() 等字符做语法解析
            COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_TEMPLATE" \
              | sed -e "s#\${PKG_NAME}#${PKG_NAME}#g" \
                    -e "s#\${VERSION}#${VERSION}#g" \
                    -e "s#\${BUILD_TIME}#${BUILD_TIME}#g")
            echo "==> 提交信息: $COMMIT_MSG"
            git commit -m "$COMMIT_MSG"
            git push
            echo "==> 推送完成"
          fi
          echo "==> 提交并推送 完成"

      - name: 结果总结
        run: |
          echo "==> 结果总结 开始"
          {
            echo "## mosdns IPK 更新结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | $VERSION |"
            echo "| 强制更新 | $FORCE_UPDATE |"
            echo "| 北京时间 | $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') |"
            echo "| 目标目录 | run/x86_64/luci-app-mosdns、run/aarch64/luci-app-mosdns |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "==> 结果总结 完成"

      - name: 清理临时文件
        run: |
          echo "==> 清理临时文件 开始"
          rm -rf /tmp/mosdns-build /tmp/mosdns-extract
          rm -f /tmp/mosdns-release.json /tmp/mosdns-download-plan.json /tmp/mosdns-plan.txt
          echo "==> 清理临时文件 完成"