name: Passwall2 Openwrt24版本

on:
  schedule:
    - cron: "17 22 * * *"	# 北京时间早上 6 点 17 分
  workflow_dispatch:

# 防止定时任务与手动触发并发执行导致提交冲突
concurrency:
  group: passwall2-repo-build
  cancel-in-progress: false

permissions:
  contents: write	# 允许推送到本仓库
  actions: write	# 允许清理本仓库的 Actions 运行缓存

jobs:
  build:
    name: 构建passwall2并提交到本仓库
    runs-on: ubuntu-26.04

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 获取Passwall2最新版本标签
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest | jq -r '.tag_name')
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV
          echo "最新版本标签: $latest_tag"

      - name: 定义构建文件名与时间戳
        run: |
          BUILD_TIME=$(TZ="Asia/Shanghai" date +'%Y%m%d_%H%M%S')
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "X86_RUN_NAME=passwall2_x86_64_${LATEST_TAG}.run" >> $GITHUB_ENV
          echo "ARM64_RUN_NAME=passwall2_aarch64_${LATEST_TAG}.run" >> $GITHUB_ENV
          echo "x86构建文件名: passwall2_x86_64_${LATEST_TAG}.run"
          echo "arm64构建文件名: passwall2_aarch64_${LATEST_TAG}.run"

      - name: 检查是否已有相同版本
        id: check_version
        run: |
          mkdir -p run/x86 run/arm64
          X86_EXISTS=$(find run/x86 -name "passwall2_x86_64_${LATEST_TAG}_*.run" 2>/dev/null | head -1 || true)
          ARM64_EXISTS=$(find run/arm64 -name "passwall2_aarch64_${LATEST_TAG}_*.run" 2>/dev/null | head -1 || true)
          NEED_BUILD_X86="true"
          NEED_BUILD_ARM64="true"
          if [ -n "$X86_EXISTS" ]; then
            echo "x86版本 ${LATEST_TAG} 已存在: $X86_EXISTS"
            NEED_BUILD_X86="false"
          fi
          if [ -n "$ARM64_EXISTS" ]; then
            echo "arm64版本 ${LATEST_TAG} 已存在: $ARM64_EXISTS"
            NEED_BUILD_ARM64="false"
          fi
          echo "NEED_BUILD_X86=$NEED_BUILD_X86" >> $GITHUB_ENV
          echo "NEED_BUILD_ARM64=$NEED_BUILD_ARM64" >> $GITHUB_ENV
          if [ "$NEED_BUILD_X86" = "false" ] && [ "$NEED_BUILD_ARM64" = "false" ]; then
            echo "所有架构版本均为最新，无需构建"
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          else
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          fi

      - name: 克隆makeself自解压打包工具
        if: env.SKIP_BUILD != 'true'
        run: git clone https://github.com/megastep/makeself.git --depth 1

      - name: 下载最新Passwall2安装包
        if: env.SKIP_BUILD != 'true'
        run: |
          mkdir -p downloads && cd downloads
          curl -fL --retry 3 -o passwall_packages_ipk_x86_64.zip https://github.com/wztx/openwrt_store/releases/download/passwall2/passwall2_packages_ipk_x86_64.zip
          curl -fL --retry 3 -o passwall_packages_ipk_aarch64.zip https://github.com/wztx/openwrt_store/releases/download/passwall2/passwall2_packages_ipk_aarch64_generic.zip
          LUCI_URL=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest | jq -r '.assets[] | select(.name | test("luci-.*-passwall2.*\\.ipk")) | .browser_download_url' | head -1)
          echo "下载luci主程序: $LUCI_URL"
          curl -fL --retry 3 -O "$LUCI_URL"
          LANG_URL=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest | jq -r '.assets[] | select(.name | test("^luci-i18n-passwall2-zh-cn_.*\\.ipk$")) | .browser_download_url')
          echo "下载中文语言包: $LANG_URL"
          curl -fL --retry 3 -O "$LANG_URL"
          cd .. && ls -lh downloads/

      - name: 整理x86_64架构文件目录
        if: env.NEED_BUILD_X86 == 'true'
        run: |
          mkdir -p passwall_x86_64/depends passwall_x86_64/main
          unzip -q downloads/passwall_packages_ipk_x86_64.zip -d passwall_x86_64/depends
          cp downloads/luci-*.ipk passwall_x86_64/main/
          echo "x86_64文件整理完成"
          ls passwall_x86_64/main/

      - name: 整理aarch64架构文件目录
        if: env.NEED_BUILD_ARM64 == 'true'
        run: |
          mkdir -p passwall_aarch64/depends passwall_aarch64/main
          unzip -q downloads/passwall_packages_ipk_aarch64.zip -d passwall_aarch64/depends
          cp downloads/luci-*.ipk passwall_aarch64/main/
          echo "aarch64文件整理完成"
          ls passwall_aarch64/main/

      - name: 写入中文安装脚本
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          printf '%s\n' '#!/bin/sh' \
            'echo "========================================"' \
            'echo "Passwall2 自动安装脚本"' \
            'echo "========================================"' \
            '' \
            'opkg update' \
            'if [ $? -ne 0 ]; then' \
            '    echo "错误：软件包列表更新失败，请检查网络连接。"' \
            '    exit 1' \
            'fi' \
            '' \
            'echo "正在安装必要的内核模块..."' \
            'opkg install iptables-mod-tproxy iptables-mod-socket iptables-mod-iprange iptables-mod-conntrack-extra' \
            '' \
            'echo "正在安装Passwall2依赖包..."' \
            'opkg install depends/*.ipk' \
            '' \
            'echo "正在安装Passwall2主程序及中文语言包..."' \
            'opkg install main/*.ipk' \
            'if [ $? -eq 0 ]; then' \
            '    echo "========================================"' \
            '    echo "Passwall2 安装完成！"' \
            '    echo "请在路由器管理界面 服务 -> Passwall2 中配置。"' \
            '    echo "========================================"' \
            'else' \
            '    echo "错误：Passwall2安装失败。"' \
            '    exit 1' \
            'fi' > passwall_x86_64/install.sh
          chmod +x passwall_x86_64/install.sh
          echo "x86_64安装脚本已创建"
          if [ "${NEED_BUILD_ARM64}" = "true" ]; then
            mkdir -p passwall_aarch64
            cp passwall_x86_64/install.sh passwall_aarch64/install.sh
            chmod +x passwall_aarch64/install.sh
            echo "aarch64安装脚本已复制"
          fi

      - name: 移动构建目录到makeself
        if: env.SKIP_BUILD != 'true'
        run: |
          [ "${NEED_BUILD_X86}" = "true" ] && mv passwall_x86_64 makeself/
          [ "${NEED_BUILD_ARM64}" = "true" ] && mv passwall_aarch64 makeself/
          echo "目录移动完成"
          ls makeself/

      - name: 生成x86_64自解压安装包
        if: env.NEED_BUILD_X86 == 'true'
        run: |
          cd makeself
          ./makeself.sh --gzip passwall_x86_64/ "${X86_RUN_NAME}" "Passwall2 x86_64版本 自解压安装包 - 版本号: ${LATEST_TAG}" ./install.sh
          cd ..
          mkdir -p run/x86
          mv "makeself/${X86_RUN_NAME}" run/x86/
          echo "x86版本构建完成: run/x86/${X86_RUN_NAME}"
          ls -lh "run/x86/${X86_RUN_NAME}"

      - name: 生成aarch64自解压安装包
        if: env.NEED_BUILD_ARM64 == 'true'
        run: |
          cd makeself
          ./makeself.sh --gzip passwall_aarch64/ "${ARM64_RUN_NAME}" "Passwall2 aarch64版本 自解压安装包 - 版本号: ${LATEST_TAG}" ./install.sh
          cd ..
          mkdir -p run/arm64
          mv "makeself/${ARM64_RUN_NAME}" run/arm64/
          echo "arm64版本构建完成: run/arm64/${ARM64_RUN_NAME}"
          ls -lh "run/arm64/${ARM64_RUN_NAME}"

      - name: 清理本构建相关的旧版本文件
        if: env.SKIP_BUILD != 'true'
        run: |
          if [ "${NEED_BUILD_X86}" = "true" ]; then
            echo "清理x86目录下passwall2旧版本文件..."
            find run/x86 -maxdepth 1 -name "passwall2_x86_64_*.run" ! -name "${X86_RUN_NAME}" -type f -print -delete 2>/dev/null || true
          fi
          if [ "${NEED_BUILD_ARM64}" = "true" ]; then
            echo "清理arm64目录下passwall2旧版本文件..."
            find run/arm64 -maxdepth 1 -name "passwall2_aarch64_*.run" ! -name "${ARM64_RUN_NAME}" -type f -print -delete 2>/dev/null || true
          fi
          echo "旧版本清理完成，仅删除passwall2相关的.run旧文件"

      - name: 验证构建产物
        if: env.SKIP_BUILD != 'true'
        run: |
          echo "========== 最终构建产物列表 =========="
          echo "run/x86 目录 (x86_64版本):"
          ls -lh run/x86/ 2>/dev/null || echo "(空)"
          echo ""
          echo "run/arm64 目录 (aarch64版本):"
          ls -lh run/arm64/ 2>/dev/null || echo "(空)"
          echo "======================================"

      - name: 提交文件到本仓库
        if: env.SKIP_BUILD != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add run/x86/ run/arm64/
          if git diff --staged --quiet; then
            echo "没有文件变更，跳过提交"
          else
            COMMIT_TIME=$(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M:%S')
            COMMIT_MSG="自动更新 Passwall2 至版本 ${LATEST_TAG} | 构建时间: ${COMMIT_TIME}"
            echo "提交信息: ${COMMIT_MSG}"
            git commit -m "${COMMIT_MSG}"
            git push origin HEAD
            echo "文件已成功提交并推送到仓库"
          fi

      - name: 已是最新版本提示
        if: env.SKIP_BUILD == 'true'
        run: |
          echo "========================================"
          echo "当前 Passwall2 版本 (${LATEST_TAG}) 已是最新，无需重新构建。"
          echo "========================================"

      - name: 清理运行缓存和临时文件
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========== 开始清理 =========="
          echo "1. 清理GitHub Actions运行缓存..."
          CACHE_LIST=$(gh cache list --limit 100 --json id -q '.[].id' 2>/dev/null || echo "")
          if [ -n "$CACHE_LIST" ]; then
            echo "$CACHE_LIST" | while read -r cache_id; do
              [ -n "$cache_id" ] && gh cache delete "$cache_id" --confirm 2>/dev/null && echo "  已删除缓存: ${cache_id}" || true
            done
          else
            echo "  未找到运行缓存"
          fi
          echo "2. 清理临时构建文件..."
          rm -rf downloads makeself passwall_x86_64 passwall_aarch64 2>/dev/null || true
          echo "  临时文件已清理"
          echo "========== 清理完成 =========="
