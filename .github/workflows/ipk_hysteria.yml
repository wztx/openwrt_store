# =============================================================
# Hysteria OpenWrt IPK 自动构建与同步工作流
# 功能：定时检查上游最新版本（含预发布版），自动构建IPK并同步到本仓库
# 构建环境：OpenWrt 24.10
# =============================================================
name: "自动构建 Hysteria IPK 安装包"

"on":
  schedule:
    - cron: '32 22 * * *'		# 每天 UTC 时间 22:32（北京时间 06:32）定时触发
  workflow_dispatch:
    inputs:
      force_update:
        description: "强制更新（忽略版本检查，重新构建）"
        required: false
        type: boolean
        default: false

concurrency:
  group: "hysteria-build"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: "构建并同步IPK"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "检出代码"
        uses: actions/checkout@v7

      - name: "创建临时构建目录"
        run: |
          BUILD_DIR=$(mktemp -d)
          echo "BUILD_DIR=${BUILD_DIR}" >> "$GITHUB_ENV"

      - name: "获取北京时间"
        run: |
          BEIJING_TIME=$(TZ="Asia/Shanghai" date "+%Y-%m-%d %H:%M:%S")
          echo "BEIJING_TIME=${BEIJING_TIME}" >> "$GITHUB_ENV"
          echo "当前北京时间: ${BEIJING_TIME}"

      - name: "获取最新版本号（含预发布版）"
        run: |
          VERSION_INFO=$(curl -sL \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://api.github.com/repos/HyNetworks/hysteria/releases" | python3 -c '
          import sys, json, re
          data = json.load(sys.stdin)
          if not isinstance(data, list) or len(data) == 0:
              sys.exit("API返回空列表")
          latest = data[0]
          tag = latest.get("tag_name", "")
          prerelease = bool(latest.get("prerelease", False))
          # 支持多种tag格式: app/vX.Y.Z, vX.Y.Z, X.Y.Z, vX.Y.Z-beta.1 等
          m = re.search(r"(\d+\.\d+\.\d+(?:-[a-zA-Z0-9.]+)?)", tag)
          if not m:
              sys.exit("无法从tag %s 中提取版本号" % tag)
          version = m.group(1)
          vtype = "pre" if prerelease else "stable"
          print("%s|%s|%s" % (version, vtype, tag))
          ') || exit 1
          VERSION=$(echo "${VERSION_INFO}" | cut -d'|' -f1)
          VERSION_TYPE_FLAG=$(echo "${VERSION_INFO}" | cut -d'|' -f2)
          ORIG_TAG=$(echo "${VERSION_INFO}" | cut -d'|' -f3)
          if [ -z "${VERSION}" ]; then
            echo "错误：提取版本号为空"
            exit 1
          fi
          if [ "${VERSION_TYPE_FLAG}" = "pre" ]; then
            VERSION_TYPE="预发布版"
          else
            VERSION_TYPE="正式版"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_TYPE=${VERSION_TYPE}" >> "$GITHUB_ENV"
          echo "ORIG_TAG=${ORIG_TAG}" >> "$GITHUB_ENV"
          echo "上游最新版本: ${VERSION} (${VERSION_TYPE}), tag: ${ORIG_TAG}"

      - name: "检查文件是否已存在"
        id: check_exist
        run: |
          RELEASE="1"
          X86_64_IPK="run/x86_64/hysteria-core/hysteria_${VERSION}-${RELEASE}_x86_64.ipk"
          AARCH64_IPK="run/aarch64/hysteria-core/hysteria_${VERSION}-${RELEASE}_aarch64.ipk"
          echo "X86_64_IPK=${X86_64_IPK}" >> "$GITHUB_ENV"
          echo "AARCH64_IPK=${AARCH64_IPK}" >> "$GITHUB_ENV"
          echo "预期文件:"
          echo "  - ${X86_64_IPK}"
          echo "  - ${AARCH64_IPK}"
          SKIP_BUILD="false"
          if [ "${{ inputs.force_update }}" != "true" ]; then
            if [ -f "${X86_64_IPK}" ] && [ -f "${AARCH64_IPK}" ]; then
              echo "两个架构IPK文件均已存在，跳过构建"
              SKIP_BUILD="true"
            fi
          else
            echo "启用强制更新模式，将重新构建"
          fi
          echo "SKIP_BUILD=${SKIP_BUILD}" >> "$GITHUB_ENV"

      - name: "下载二进制文件"
        if: env.SKIP_BUILD != 'true'
        run: |
          mkdir -p "${BUILD_DIR}/bin"
          # URL编码原始tag中的/符号
          TAG_ENCODED=$(echo "${ORIG_TAG}" | sed 's/\//%2F/g')
          echo "下载 amd64 二进制..."
          curl -fL --retry 3 -H "User-Agent: Mozilla/5.0" "https://github.com/HyNetworks/hysteria/releases/download/${TAG_ENCODED}/hysteria-linux-amd64" -o "${BUILD_DIR}/bin/hysteria-amd64" || exit 1
          echo "下载 arm64 二进制..."
          curl -fL --retry 3 -H "User-Agent: Mozilla/5.0" "https://github.com/HyNetworks/hysteria/releases/download/${TAG_ENCODED}/hysteria-linux-arm64" -o "${BUILD_DIR}/bin/hysteria-arm64" || exit 1
          echo "下载完成"
          ls -lh "${BUILD_DIR}/bin/"

      - name: "构建 x86_64 架构 IPK"
        if: env.SKIP_BUILD != 'true'
        run: |
          RELEASE="1"
          ARCH_BIN="amd64"
          ARCH_PKG="x86_64"
          ARCH_DST="x86_64"
          IPK_NAME="hysteria_${VERSION}-${RELEASE}_${ARCH_PKG}.ipk"
          IPK_DIR="${BUILD_DIR}/ipk-${ARCH_PKG}"
          echo "构建 ${IPK_NAME}..."
          mkdir -p "${IPK_DIR}/data/usr/bin"
          mkdir -p "${IPK_DIR}/control"
          cp "${BUILD_DIR}/bin/hysteria-${ARCH_BIN}" "${IPK_DIR}/data/usr/bin/hysteria"
          chmod 755 "${IPK_DIR}/data/usr/bin/hysteria"
          MAGIC=$(od -An -tx1 -N4 "${IPK_DIR}/data/usr/bin/hysteria" | tr -d ' \n')
          echo "ELF magic: ${MAGIC}"
          if [ "${MAGIC}" != "7f454c46" ]; then
            echo "错误：二进制文件ELF头校验失败，文件可能损坏"
            exit 1
          fi
          echo "ELF头校验通过"
          # 写control文件
          printf 'Package: hysteria\nVersion: %s-%s\nSection: net\nPriority: optional\nArchitecture: %s\nDepends: libc\nInstalled-Size: %s\nMaintainer: Auto Build <auto-build@github.com>\nDescription: Hysteria is a feature-packed proxy & relay tool optimized for harsh networks.\n' "${VERSION}" "${RELEASE}" "${ARCH_PKG}" "$(du -sk "${IPK_DIR}/data" | cut -f1)" > "${IPK_DIR}/control/control"
          # 写postinst脚本（必须判断IPKG_INSTROOT，否则ImageBuilder构建镜像时会chmod根路径导致失败）
          # 写postinst脚本（必须判断IPKG_INSTROOT，否则ImageBuilder构建镜像时会chmod根路径导致失败）
          printf '#!/bin/sh\n[ -n "$IPKG_INSTROOT" ] && exit 0\nchmod 0755 /usr/bin/hysteria\nexit 0\n' > "${IPK_DIR}/control/postinst"
          chmod 755 "${IPK_DIR}/control/postinst"
          # 打包
          printf '2.0\n' > "${IPK_DIR}/debian-binary"
          ( cd "${IPK_DIR}/control" && tar -czf "${IPK_DIR}/control.tar.gz" . ) || exit 1
          ( cd "${IPK_DIR}/data" && tar -czf "${IPK_DIR}/data.tar.gz" . ) || exit 1
          ( cd "${IPK_DIR}" && tar -czf "${BUILD_DIR}/${IPK_NAME}" ./debian-binary ./control.tar.gz ./data.tar.gz ) || exit 1
          # 校验
          IPK_SIZE=$(stat -c%s "${BUILD_DIR}/${IPK_NAME}")
          echo "IPK文件大小: ${IPK_SIZE} 字节"
          if [ "${IPK_SIZE}" -lt 1048576 ]; then
            echo "错误：IPK文件过小（小于1MB），构建可能失败"
            exit 1
          fi
          tar -tzf "${BUILD_DIR}/${IPK_NAME}" | grep -q "debian-binary" || { echo "错误：缺少debian-binary"; exit 1; }
          tar -tzf "${BUILD_DIR}/${IPK_NAME}" | grep -q "control.tar.gz" || { echo "错误：缺少control.tar.gz"; exit 1; }
          tar -tzf "${BUILD_DIR}/${IPK_NAME}" | grep -q "data.tar.gz" || { echo "错误：缺少data.tar.gz"; exit 1; }
          mkdir -p "${IPK_DIR}/verify"
          ( cd "${IPK_DIR}/verify" && tar -xzf "${BUILD_DIR}/${IPK_NAME}" && tar -xzf data.tar.gz ) || exit 1
          if [ ! -f "${IPK_DIR}/verify/usr/bin/hysteria" ]; then
            echo "错误：IPK内部路径验证失败，未找到usr/bin/hysteria"
            exit 1
          fi
          # 模拟ImageBuilder构建环境执行postinst（设置IPKG_INSTROOT），验证脚本返回0
          ( mkdir -p "${IPK_DIR}/verify/fake_root" && IPKG_INSTROOT="${IPK_DIR}/verify/fake_root/" sh "${IPK_DIR}/control/postinst" ) || { echo "错误：postinst在构建环境执行失败（exit $?）"; exit 1; }
          echo "IPK格式、结构、postinst脚本校验全部通过"
          REPO_DIR="${GITHUB_WORKSPACE}/run/${ARCH_DST}/hysteria-core"
          mkdir -p "${REPO_DIR}"
          cp "${BUILD_DIR}/${IPK_NAME}" "${REPO_DIR}/"
          echo "✅ ${IPK_NAME} 构建完成，已复制到仓库目录 ${REPO_DIR}/"

      - name: "构建 aarch64 架构 IPK"
        if: env.SKIP_BUILD != 'true'
        run: |
          RELEASE="1"
          ARCH_BIN="arm64"
          ARCH_PKG="aarch64"
          ARCH_DST="aarch64"
          IPK_NAME="hysteria_${VERSION}-${RELEASE}_${ARCH_PKG}.ipk"
          IPK_DIR="${BUILD_DIR}/ipk-${ARCH_PKG}"
          echo "构建 ${IPK_NAME}..."
          mkdir -p "${IPK_DIR}/data/usr/bin"
          mkdir -p "${IPK_DIR}/control"
          cp "${BUILD_DIR}/bin/hysteria-${ARCH_BIN}" "${IPK_DIR}/data/usr/bin/hysteria"
          chmod 755 "${IPK_DIR}/data/usr/bin/hysteria"
          MAGIC=$(od -An -tx1 -N4 "${IPK_DIR}/data/usr/bin/hysteria" | tr -d ' \n')
          echo "ELF magic: ${MAGIC}"
          if [ "${MAGIC}" != "7f454c46" ]; then
            echo "错误：二进制文件ELF头校验失败，文件可能损坏"
            exit 1
          fi
          echo "ELF头校验通过"
          # 写control文件
          printf 'Package: hysteria\nVersion: %s-%s\nSection: net\nPriority: optional\nArchitecture: %s\nDepends: libc\nInstalled-Size: %s\nMaintainer: Auto Build <auto-build@github.com>\nDescription: Hysteria is a feature-packed proxy & relay tool optimized for harsh networks.\n' "${VERSION}" "${RELEASE}" "${ARCH_PKG}" "$(du -sk "${IPK_DIR}/data" | cut -f1)" > "${IPK_DIR}/control/control"
          # 写postinst脚本（必须判断IPKG_INSTROOT，否则ImageBuilder构建镜像时会chmod根路径导致失败）
          # 写postinst脚本（必须判断IPKG_INSTROOT，否则ImageBuilder构建镜像时会chmod根路径导致失败）
          printf '#!/bin/sh\n[ -n "$IPKG_INSTROOT" ] && exit 0\nchmod 0755 /usr/bin/hysteria\nexit 0\n' > "${IPK_DIR}/control/postinst"
          chmod 755 "${IPK_DIR}/control/postinst"
          # 打包
          printf '2.0\n' > "${IPK_DIR}/debian-binary"
          ( cd "${IPK_DIR}/control" && tar -czf "${IPK_DIR}/control.tar.gz" . ) || exit 1
          ( cd "${IPK_DIR}/data" && tar -czf "${IPK_DIR}/data.tar.gz" . ) || exit 1
          ( cd "${IPK_DIR}" && tar -czf "${BUILD_DIR}/${IPK_NAME}" ./debian-binary ./control.tar.gz ./data.tar.gz ) || exit 1
          # 校验
          IPK_SIZE=$(stat -c%s "${BUILD_DIR}/${IPK_NAME}")
          echo "IPK文件大小: ${IPK_SIZE} 字节"
          if [ "${IPK_SIZE}" -lt 1048576 ]; then
            echo "错误：IPK文件过小（小于1MB），构建可能失败"
            exit 1
          fi
          tar -tzf "${BUILD_DIR}/${IPK_NAME}" | grep -q "debian-binary" || { echo "错误：缺少debian-binary"; exit 1; }
          tar -tzf "${BUILD_DIR}/${IPK_NAME}" | grep -q "control.tar.gz" || { echo "错误：缺少control.tar.gz"; exit 1; }
          tar -tzf "${BUILD_DIR}/${IPK_NAME}" | grep -q "data.tar.gz" || { echo "错误：缺少data.tar.gz"; exit 1; }
          mkdir -p "${IPK_DIR}/verify"
          ( cd "${IPK_DIR}/verify" && tar -xzf "${BUILD_DIR}/${IPK_NAME}" && tar -xzf data.tar.gz ) || exit 1
          if [ ! -f "${IPK_DIR}/verify/usr/bin/hysteria" ]; then
            echo "错误：IPK内部路径验证失败，未找到usr/bin/hysteria"
            exit 1
          fi
          # 模拟ImageBuilder构建环境执行postinst（设置IPKG_INSTROOT），验证脚本返回0
          ( mkdir -p "${IPK_DIR}/verify/fake_root" && IPKG_INSTROOT="${IPK_DIR}/verify/fake_root/" sh "${IPK_DIR}/control/postinst" ) || { echo "错误：postinst在构建环境执行失败（exit $?）"; exit 1; }
          echo "IPK格式、结构、postinst脚本校验全部通过"
          REPO_DIR="${GITHUB_WORKSPACE}/run/${ARCH_DST}/hysteria-core"
          mkdir -p "${REPO_DIR}"
          cp "${BUILD_DIR}/${IPK_NAME}" "${REPO_DIR}/"
          echo "✅ ${IPK_NAME} 构建完成，已复制到仓库目录 ${REPO_DIR}/"

      - name: "清理本工作流相关旧版本文件"
        if: env.SKIP_BUILD != 'true'
        run: |
          echo "开始清理旧版本IPK文件..."
          KEEP_X86=$(basename "${X86_64_IPK}")
          KEEP_AARCH64=$(basename "${AARCH64_IPK}")
          for DIR in "run/x86_64/hysteria-core" "run/aarch64/hysteria-core"; do
            if [ -d "${DIR}" ]; then
              for f in "${DIR}"/*.ipk; do
                [ -f "$f" ] || continue
                fname=$(basename "$f")
                # 精确匹配 hysteria_版本号-发布号_架构.ipk 格式（无v前缀）
                if echo "${fname}" | grep -qE '^hysteria_[0-9]+\.[0-9]+\.[0-9]+-[0-9]+_(x86_64|aarch64)\.ipk$'; then
                  if [ "${fname}" != "${KEEP_X86}" ] && [ "${fname}" != "${KEEP_AARCH64}" ]; then
                    echo "删除旧版本: $f"
                    rm -f "$f"
                  fi
                fi
              done
            fi
          done
          echo "旧版本清理完成"

      - name: "提交并推送到仓库"
        if: env.SKIP_BUILD != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "run/x86_64/hysteria-core/*.ipk" "run/aarch64/hysteria-core/*.ipk"
          COMMIT_MSG="🔄自动构建 Hysteria ${VERSION_TYPE} v${VERSION} | ${BEIJING_TIME}(北京时间)"
          echo "提交信息: ${COMMIT_MSG}"
          git commit -m "${COMMIT_MSG}" || echo "无变更需要提交"
          git push
          echo "✅ 推送完成"

      - name: "清理临时文件（无论成功失败）"
        if: always()
        run: |
          echo "清理临时构建目录..."
          if [ -n "${BUILD_DIR}" ] && [ -d "${BUILD_DIR}" ]; then
            rm -rf "${BUILD_DIR}"
            echo "临时目录已清理: ${BUILD_DIR}"
          fi
          echo "清理完成"
