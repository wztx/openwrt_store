name: 自动更新 argon 主题包

on:
  schedule:
    # 每天 UTC 22:19（北京时间次日 06:19）触发
    - cron: '19 22 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制重新下载并提交'
        required: false
        default: false
        type: boolean

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_BASE: https://mirrors.vsean.net/openwrt/releases/24.10.6/packages/x86_64/luci
  PKG_NAME: luci-theme-argon
  PKG_DIR_NAME: luci-theme-argon
  TZ: Asia/Shanghai
  ARCH_MATRIX: |
    [
      {
        "arch": "x86_64",
        "dest_dir": "run/x86_64"
      },
      {
        "arch": "aarch64_generic",
        "dest_dir": "run/aarch64"
      }
    ]
  PACKAGE_PATTERNS: |
    luci-theme-argon_*_all.ipk
    luci-app-argon-config_*_all.ipk
    luci-i18n-argon-config-zh-cn_*_all.ipk
  COMMIT_MSG_TEMPLATE: "🔄自动更新 ${PKG_NAME} ${VERSION} | ${BUILD_TIME}(北京时间)"

jobs:
  update-argon-theme:
    name: 更新 argon 主题包
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 读取触发参数
        env:
          FORCE_UPDATE: "${{ github.event.inputs.force_update || 'false' }}"
        run: |
          echo "==> 读取触发参数 开始"
          echo "强制更新: $FORCE_UPDATE"
          echo "FORCE_UPDATE=$FORCE_UPDATE" >> "$GITHUB_ENV"
          echo "==> 读取触发参数 完成"

      - name: 生成运行时变量
        run: |
          echo "==> 生成运行时变量 开始"
          BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          echo "REMOTE_FILES_JSON=/tmp/argon-theme-files.json" >> "$GITHUB_ENV"
          echo "北京时间: $BUILD_TIME"
          echo "远程文件列表 JSON: /tmp/argon-theme-files.json"
          echo "==> 生成运行时变量 完成"

      - name: 获取远程软件包列表与版本号
        run: |
          echo "==> 获取远程软件包列表与版本号 开始"
          python3 - <<'PY' || exit 1
          import os
          import re
          import json
          import sys
          import urllib.request
          import urllib.parse

          # 远程目录地址，必须带 User-Agent 请求
          base = os.environ["UPSTREAM_BASE"].rstrip("/") + "/"
          print(f"==> 请求远程目录: {base}")

          req = urllib.request.Request(
              base,
              headers={"User-Agent": "argon-theme-updater"}
          )

          with urllib.request.urlopen(req, timeout=30) as resp:
              html = resp.read().decode("utf-8", errors="replace")

          # 读取待匹配的文件名模式
          patterns = [
              line.strip()
              for line in os.environ["PACKAGE_PATTERNS"].splitlines()
              if line.strip()
          ]

          # 解析目录 HTML 中的 .ipk 链接，兼容相对链接与绝对链接
          links = re.findall(r"""href=["']([^"']+\.ipk)["']""", html, flags=re.I)
          files = []
          seen = set()

          for link in links:
              name = os.path.basename(urllib.parse.urlparse(link).path)
              for pat in patterns:
                  # 将通配符 * 转成正则 .*，其余字符全部转义，避免正则特殊符号误判
                  regex = "^" + re.escape(pat).replace(r"\*", ".*") + "$"
                  if re.match(regex, name):
                      if name not in seen:
                          seen.add(name)
                          files.append({
                              "name": name,
                              "url": urllib.parse.urljoin(base, link)
                          })
                      break

          if not files:
              print("错误：未在远程目录找到匹配的 IPK 文件", file=sys.stderr)
              sys.exit(1)

          # 从主包文件名中提取版本号，若存在多个则取排序后最后一个
          main_pat = re.compile(r"^luci-theme-argon_(.+)_all\.ipk$")
          versions = []
          for item in files:
              m = main_pat.match(item["name"])
              if m:
                  versions.append(m.group(1))

          if versions:
              version = sorted(versions)[-1]
          else:
              version = "unknown"

          print(f"==> 匹配文件数: {len(files)}")
          for item in files:
              print(f"==> 文件: {item['name']} -> {item['url']}")
          print(f"==> 解析版本号: {version}")

          # 写出远程文件清单，供后续步骤复用
          with open(os.environ["REMOTE_FILES_JSON"], "w", encoding="utf-8") as f:
              json.dump(files, f, ensure_ascii=False, indent=2)

          # 将版本号写入 GitHub Actions 运行时变量
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VERSION={version}\n")
          PY
          echo "==> 获取远程软件包列表与版本号 完成"

      - name: 版本对比检查
        run: |
          echo "==> 版本对比检查 开始"
          python3 - <<'PY' || exit 1
          import os
          import json

          remote_files = json.load(open(os.environ["REMOTE_FILES_JSON"], encoding="utf-8"))
          archs = json.loads(os.environ["ARCH_MATRIX"])
          force = os.environ.get("FORCE_UPDATE", "false").lower() == "true"
          build_archs = []

          # 逐个架构检查目标目录是否已存在全部远程文件
          for item in archs:
              arch = item["arch"]
              dest_dir = item["dest_dir"]
              target_dir = os.path.join(dest_dir, os.environ["PKG_DIR_NAME"])
              missing = []

              for remote in remote_files:
                  local_path = os.path.join(target_dir, remote["name"])
                  if not os.path.exists(local_path):
                      missing.append(remote["name"])

              # force_update=true 或存在缺失文件时纳入待更新列表
              if force or missing:
                  build_archs.append(arch)
                  reason = "force_update=true" if force else f"缺失文件: {missing}"
                  print(f"==> 架构 {arch}: 需要更新，原因: {reason}")
              else:
                  print(f"==> 架构 {arch}: 已存在全部文件，跳过")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"BUILD_ARCHS={' '.join(build_archs)}\n")

          print(f"==> 待更新架构: {' '.join(build_archs) if build_archs else '无'}")
          PY
          echo "==> 版本对比检查 完成"

      - name: 下载远程软件包
        run: |
          echo "==> 下载远程软件包 开始"
          if [ -z "$BUILD_ARCHS" ]; then
            echo "==> 无待更新架构，跳过下载"
          else
            for arch in $BUILD_ARCHS; do
              echo "==> 处理架构: $arch"
              download_dir="/tmp/argon-theme-download/$arch"
              mkdir -p "$download_dir" || exit 1
              list_file="$download_dir/files.tsv"

              # 从远程文件清单中导出「文件名 + URL」列表
              python3 - "$REMOTE_FILES_JSON" > "$list_file" <<'PY' || exit 1
          import json
          import sys

          files = json.load(open(sys.argv[1], encoding="utf-8"))

          for item in files:
              print(f"{item['name']}\t{item['url']}")
          PY

              while IFS=$'\t' read -r name url; do
                [ -n "$name" ] || continue
                save_path="$download_dir/$name"
                echo "==> 下载: $url"
                echo "==> 保存到: $save_path"
                # 外部 HTTP 请求必须带 User-Agent
                curl -L --fail --retry 3 --retry-delay 2 \
                  -H "User-Agent: argon-theme-updater" \
                  -o "$save_path" "$url" || {
                    echo "错误：下载失败 $url" >&2
                    exit 1
                  }
                [ -s "$save_path" ] || {
                  echo "错误：下载文件为空 $save_path" >&2
                  exit 1
                }
                size=$(stat -c '%s' "$save_path") || exit 1
                echo "==> 文件大小: $size 字节"
              done < "$list_file"
            done
          fi
          echo "==> 下载远程软件包 完成"

      - name: 复制到目标目录并清理旧版本
        run: |
          echo "==> 复制到目标目录并清理旧版本 开始"
          if [ -z "$BUILD_ARCHS" ]; then
            echo "==> 无待更新架构，跳过复制"
          else
            # 生成需要保留的文件名清单
            keep_file="/tmp/argon-theme-keep.txt"
            python3 - "$REMOTE_FILES_JSON" > "$keep_file" <<'PY' || exit 1
          import json
          import sys

          files = json.load(open(sys.argv[1], encoding="utf-8"))
          for item in files:
              print(item["name"])
          PY

            for arch in $BUILD_ARCHS; do
              echo "==> 处理架构: $arch"

              # 从 ARCH_MATRIX 中查出当前架构对应的提交目录
              dest_dir=$(python3 - "$arch" <<'PY'
          import json
          import os
          import sys

          arch = sys.argv[1]
          archs = json.loads(os.environ["ARCH_MATRIX"])
          for item in archs:
              if item["arch"] == arch:
                  print(item["dest_dir"])
                  break
          PY
              ) || exit 1

              if [ -z "$dest_dir" ]; then
                echo "错误：未找到架构 $arch 对应的目标目录" >&2
                exit 1
              fi

              target_dir="$dest_dir/$PKG_DIR_NAME"
              mkdir -p "$target_dir" || exit 1

              # luci 文件虽然是 all 架构，但要求每个架构目录各存放一份
              cp /tmp/argon-theme-download/$arch/*.ipk "$target_dir/" || exit 1
              echo "==> 架构 $arch 已复制文件到 $target_dir"

              for f in "$target_dir"/*.ipk; do
                [ -e "$f" ] || continue
                base=$(basename "$f")

                # 本次远程文件保留，不删除
                if grep -Fxq "$base" "$keep_file"; then
                  echo "==> 保留文件: $f"
                  continue
                fi

                # 只清理三个包模式的旧文件，其他文件不动
                case "$base" in
                  luci-theme-argon_*_all.ipk|luci-app-argon-config_*_all.ipk|luci-i18n-argon-config-zh-cn_*_all.ipk)
                    rm -f "$f" || exit 1
                    echo "==> 删除旧文件: $f"
                    ;;
                  *)
                    echo "==> 非目标模式，保留文件: $f"
                    ;;
                esac
              done

              echo "==> 目录 $target_dir 当前文件:"
              ls -l "$target_dir" || exit 1
            done
          fi
          echo "==> 复制到目标目录并清理旧版本 完成"

      - name: 提交并推送
        run: |
          echo "==> 提交并推送 开始"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 用运行时变量替换提交信息模板
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_TEMPLATE" | sed \
            -e "s|\${PKG_NAME}|${PKG_NAME}|g" \
            -e "s|\${VERSION}|${VERSION}|g" \
            -e "s|\${BUILD_TIME}|${BUILD_TIME}|g")
          echo "COMMIT_MSG=$COMMIT_MSG" >> "$GITHUB_ENV"
          echo "==> 提交信息: $COMMIT_MSG"

          if [ -d run ]; then
            git add run/
          else
            echo "==> run 目录不存在，无需添加"
          fi

          if git diff --cached --quiet; then
            echo "==> 无变更，跳过提交"
          else
            git commit -m "$COMMIT_MSG" || exit 1
            git push || exit 1
            echo "==> 推送完成"
          fi
          echo "==> 提交并推送 完成"

      - name: 结果总结
        run: |
          echo "==> 结果总结 开始"
          {
            echo "## 自动更新 argon IPK 软件包"
            echo ""
            echo "- 版本：${VERSION:-未知}"
            echo "- 待更新架构：${BUILD_ARCHS:-无}"
            echo "- 提交信息：${COMMIT_MSG:-无}"
            echo ""
            echo "### 目标目录"
            echo "- run/x86_64/luci-theme-argon/"
            echo "- run/aarch64/luci-theme-argon/"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "==> 结果总结 完成"

      - name: 清理缓存和临时文件
        run: |
          echo "==> 清理缓存和临时文件 开始"
          rm -rf /tmp/argon-theme-download
          if [ -n "$REMOTE_FILES_JSON" ]; then
            rm -f "$REMOTE_FILES_JSON"
          fi
          rm -f /tmp/argon-theme-keep.txt
          echo "==> 清理缓存和临时文件 完成"