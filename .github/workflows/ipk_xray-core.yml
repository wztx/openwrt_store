# ============================================================
# Xray-core 自动同步打包工作流 (OpenWrt 24.10 ipk)
# ============================================================
name: Xray-core 自动同步打包

# --------------------------------------------------------
# 触发方式
# --------------------------------------------------------
"on":
  schedule:
    # 每天 UTC 22:30 执行（北京时间 06:30）
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: 是否强制更新（即使版本未变化也重新打包）
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# --------------------------------------------------------
# 并发限制：同组任务最多 1 个，不取消正在进行中的任务
# --------------------------------------------------------
concurrency:
  group: xray-core-sync-group
  cancel-in-progress: false

permissions:
  contents: write

env:
  USER_AGENT: "Mozilla/5.0 (Xray-core-Sync-Bot; +https://github.com) xray-core-updater/1.0"
  API_URL: "https://api.github.com/repos/XTLS/Xray-core/releases"
  TZ: "Asia/Shanghai"

jobs:
  sync-and-build:
    name: 同步版本并构建 IPK 包
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------
      # 1. 检出仓库代码
      # --------------------------------------------------------
      - name: 检出仓库代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # 2. 获取上游最新版本号（含预发布/测试版）
      # --------------------------------------------------------
      - name: 获取上游最新版本号
        id: get_version
        run: |
          echo "正在请求 Xray-core 发布列表..."
          response=$(curl -sSL --retry 3 -A "${USER_AGENT}" "${API_URL}")
          if [ -z "$response" ]; then
            echo "❌ 获取版本信息失败：API 无响应"
            exit 1
          fi
          version=$(echo "$response" | jq -r '.[0].tag_name')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "❌ 解析版本号失败，API 返回：$response"
            exit 1
          fi
          echo "✅ 上游最新版本：${version}"
          echo "latest_version=${version}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # 3. 读取触发参数
      # --------------------------------------------------------
      - name: 读取触发参数
        id: params
        run: |
          force="${{ inputs.force_update }}"
          if [ -z "$force" ]; then force="false"; fi
          echo "force_update=${force}" >> "$GITHUB_OUTPUT"
          echo "强制更新：${force}"

      # --------------------------------------------------------
      # 4. 版本对比（纯文件名对比）
      # --------------------------------------------------------
      - name: 版本对比检查
        id: check
        run: |
          ver="${{ steps.get_version.outputs.latest_version }}"
          force="${{ steps.params.outputs.force_update }}"

          x86_file="run/x86_64/xray-core/xray-core_${ver}_x86_64.ipk"
          arm_file="run/aarch64/xray-core/xray-core_${ver}_aarch64.ipk"

          echo "期望文件："
          echo "  - ${x86_file}"
          echo "  - ${arm_file}"

          if [ "$force" = "true" ]; then
            echo "🔧 强制更新模式：跳过存在性检查"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          elif [ -f "$x86_file" ] && [ -f "$arm_file" ]; then
            echo "⏭️  当前版本 ${ver} 的两个架构包均已存在，无需构建。"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "🔄 需要构建新版本 ${ver}"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------
      # 5. 下载并打包 IPK（关键修复：使用 tar.gz 最外层格式）
      # --------------------------------------------------------
      - name: 下载二进制并构建 IPK 包
        if: steps.check.outputs.need_build == 'true'
        run: |
          set -euo pipefail

          WORK_DIR="$(pwd)"
          TMPDIR="$(mktemp -d)"
          trap 'echo "🧹 清理临时文件..."; rm -rf "$TMPDIR"' EXIT

          ver="${{ steps.get_version.outputs.latest_version }}"
          echo "============================================"
          echo "开始构建 Xray-core ${ver}"
          echo "临时目录：$TMPDIR"
          echo "============================================"

          DOWNLOAD_BASE="https://github.com/XTLS/Xray-core/releases/download/${ver}"

          # --- 架构配置映射表：(zip文件名 => ipk架构名 => 输出目录名) ---
          declare -A ARCH_ZIP=(
            ["x86_64"]="Xray-linux-64"
            ["aarch64"]="Xray-linux-arm64-v8a"
          )
          declare -A ARCH_OUTDIR=(
            ["x86_64"]="run/x86_64/xray-core"
            ["aarch64"]="run/aarch64/xray-core"
          )

          for ipk_arch in x86_64 aarch64; do
            zip_name="${ARCH_ZIP[$ipk_arch]}"
            out_dir="${ARCH_OUTDIR[$ipk_arch]}"

            echo ""
            echo "--------------------------------------------"
            echo "▶ 处理架构：${ipk_arch} (zip: ${zip_name}.zip)"
            echo "--------------------------------------------"

            # 5.1 下载
            zip_url="${DOWNLOAD_BASE}/${zip_name}.zip"
            echo "下载：${zip_url}"
            curl -sSL --retry 3 -A "${USER_AGENT}" -o "${TMPDIR}/pkg.zip" "$zip_url"

            # 5.2 解压：只提取 xray 二进制，其余全部丢弃
            pkg_build="${TMPDIR}/build_${ipk_arch}"
            mkdir -p "${pkg_build}/data/usr/bin"
            unzip -oj "${TMPDIR}/pkg.zip" "xray" -d "${pkg_build}/data/usr/bin/"
            chmod 0755 "${pkg_build}/data/usr/bin/xray"
            rm -f "${TMPDIR}/pkg.zip"
            echo "✅ 已提取 xray 二进制到 data/usr/bin/xray"

            # 5.3 构建 data.tar.gz（对齐 OpenWrt 官方 ipkg-build：cd 后 tar . 自动带 ./ 前缀）
            echo "打包 data.tar.gz ..."
            ( cd "${pkg_build}/data" && tar -czf "${pkg_build}/data.tar.gz" \
                --numeric-owner --owner=0 --group=0 . )

            # 5.4 写入 control 文件和 postinst 脚本（使用 printf 避免 YAML heredoc 解析陷阱）
            ctrl_dir="${pkg_build}/control"
            mkdir -p "$ctrl_dir"
            installed_size=$(du -k "${pkg_build}/data/usr/bin/xray" | cut -f1)

            printf '%s\n' \
              "Package: xray-core" \
              "Version: ${ver}" \
              "Depends: libc" \
              "Source: XTLS/Xray-core" \
              "License: MPL-2.0" \
              "Section: net" \
              "Priority: optional" \
              "Architecture: ${ipk_arch}" \
              "Installed-Size: ${installed_size}" \
              "Maintainer: xray-core-sync-bot" \
              "Description: Xray-core is a v2ray-core fork with XTLS support." \
              " Xray is a platform for building proxies to bypass network restrictions." \
              > "${ctrl_dir}/control"
            echo "✅ control 文件已写入"

            printf '%s\n' \
              "#!/bin/sh" \
              '[ -n "$IPKG_INSTROOT" ] || {' \
              "  chmod 0755 /usr/bin/xray 2>/dev/null || true" \
              "}" \
              "exit 0" \
              > "${ctrl_dir}/postinst"
            chmod 0755 "${ctrl_dir}/postinst"
            echo "✅ postinst 脚本已写入"

            # 5.5 构建 control.tar.gz（同样用 tar . 带 ./ 前缀）
            echo "打包 control.tar.gz ..."
            ( cd "$ctrl_dir" && tar -czf "${pkg_build}/control.tar.gz" \
                --numeric-owner --owner=0 --group=0 . )

            # 5.6 写入 debian-binary（必须以换行结尾）
            printf '2.0\n' > "${pkg_build}/debian-binary"

            # 5.7 最终打包 IPK
            #     ★ 关键修复：最外层必须是 tar.gz（OpenWrt ipk 规范），不是 Debian 的 ar 格式！
            #     顺序必须为：debian-binary → control.tar.gz → data.tar.gz（带 ./ 前缀）
            mkdir -p "$out_dir"
            ipk_path="${out_dir}/xray-core_${ver}_${ipk_arch}.ipk"

            echo "最终打包 ${ipk_path} ..."
            ( cd "$pkg_build" && tar -czf "${WORK_DIR}/${ipk_path}" \
                --numeric-owner --owner=0 --group=0 \
                ./debian-binary ./control.tar.gz ./data.tar.gz )
            echo "✅ IPK 已生成：${ipk_path} ($(du -h "${ipk_path}" | cut -f1))"
          done

          echo ""
          echo "============================================"
          echo "🎉 所有架构打包完成"
          echo "============================================"

      # --------------------------------------------------------
      # 6. 清理本工作流相关旧版本文件（精确匹配，不碰其他文件）
      # --------------------------------------------------------
      - name: 清理旧版本文件
        if: steps.check.outputs.need_build == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.get_version.outputs.latest_version }}"

          echo "清理旧版本 IPK（保留当前版本 ${ver}）..."
          for out_dir in "run/x86_64/xray-core" "run/aarch64/xray-core"; do
            if [ -d "$out_dir" ]; then
              cd "$out_dir"
              # 精确匹配 xray-core_*.ipk，只删除非当前版本（用 bash 内置模式匹配避免 grep SIGPIPE）
              for f in xray-core_*.ipk; do
                [ -e "$f" ] || continue
                case "$f" in
                  *"_${ver}_"*)
                  echo "  保留：$f"
                    ;;
                  *)
                  echo "  删除：$f"
                  rm -f -- "$f"
                    ;;
                esac
              done
              cd - >/dev/null
            fi
          done
          echo "✅ 旧版本清理完毕"

      # --------------------------------------------------------
      # 7. IPK 完整性校验
      # --------------------------------------------------------
      - name: IPK 完整性校验
        if: steps.check.outputs.need_build == 'true'
        run: |
          # 注意：这里不要加 pipefail。校验过程中会有大量 `tar | grep -q` / `tar | dd` 管道，
          # grep/dd 提前关闭时上游 tar 会收到 SIGPIPE，这属于正常情况，不是失败。
          # 我们用 all_ok 变量显式校验结果即可。
          set -eu
          ver="${{ steps.get_version.outputs.latest_version }}"
          all_ok=true

          for ipk_arch in x86_64 aarch64; do
            ipk_path=""
            if [ "$ipk_arch" = "x86_64" ]; then
              ipk_path="run/x86_64/xray-core/xray-core_${ver}_x86_64.ipk"
            else
              ipk_path="run/aarch64/xray-core/xray-core_${ver}_aarch64.ipk"
            fi

            echo "--------------------------------------------"
            echo "校验：${ipk_path}"
            echo "--------------------------------------------"

            # 7.1 文件存在
            if [ ! -f "$ipk_path" ]; then
              echo "❌ 文件不存在"
              all_ok=false; continue
            fi
            fsize=$(stat -c%s "$ipk_path")
            echo "  文件大小：${fsize} 字节"
            if [ "$fsize" -lt 1048576 ]; then
              echo "❌ 文件过小 (<1MB)，可能打包异常"
              all_ok=false; continue
            fi

            # 7.2 文件类型应为 gzip compressed data（OpenWrt ipk 最外层是 tar.gz，不是 ar/deb）
            ftype=$(file -b "$ipk_path")
            echo "  文件类型：${ftype}"
            if ! echo "$ftype" | grep -qi "gzip"; then
              echo "❌ 文件类型异常：预期 gzip compressed，实际 ${ftype}"
              all_ok=false; continue
            fi

            # 7.3 最外层 tar 应包含三个固定名称的成员（带 ./ 前缀，符合 OpenWrt ipk 规范）
            members=$(tar -tzf "$ipk_path")
            echo "  tar 成员列表："
            echo "$members" | sed 's/^/    /'
            for need in ./debian-binary ./control.tar.gz ./data.tar.gz; do
              if ! echo "$members" | grep -Fxq "$need"; then
                echo "❌ 缺少必需成员：${need}"
                all_ok=false
              fi
            done

            # 7.4 debian-binary 内容应为 2.0
            dbv=$(tar -xzf "$ipk_path" -O ./debian-binary | tr -d '\r\n' )
            echo "  debian-binary：'${dbv}'"
            if [ "$dbv" != "2.0" ]; then
              echo "❌ debian-binary 内容异常：'${dbv}'"
              all_ok=false
            fi

            # 7.5 control.tar.gz 中包含 control 文件（内部路径同样带 ./ 前缀）
            if ! tar -xzf "$ipk_path" -O ./control.tar.gz | tar -tz | grep -qx "./control"; then
              echo "❌ control.tar.gz 中缺少 control 文件"
              all_ok=false; continue
            fi

            # 7.6 data.tar.gz 中应包含 ./usr/bin/xray
            if ! tar -xzf "$ipk_path" -O ./data.tar.gz | tar -tz | grep -q "./usr/bin/xray$"; then
              echo "❌ data.tar.gz 中未找到 ./usr/bin/xray"
              all_ok=false; continue
            fi

            # 7.7 data.tar.gz 中的 xray 应是可执行 ELF（用 dd 取前 4 字节，避免 head 触发 SIGPIPE）
            # 注意：不能用 `... | head -c 4`，在 pipefail 下 head 提前关闭管道会导致 tar 收到 SIGPIPE 并 exit 2
            xray_header=$(tar -xzf "$ipk_path" -O ./data.tar.gz \
                            | (tar -xzO ./usr/bin/xray 2>/dev/null || true) \
                            | dd bs=1 count=4 status=none 2>/dev/null \
                            | od -An -tx1 | tr -d ' \n')
            echo "  xray 文件头(hex)：${xray_header}"
            if [ "$xray_header" != "7f454c46" ]; then
              echo "❌ 不是有效的 ELF 文件（header: ${xray_header}）"
              all_ok=false; continue
            fi

            echo "✅ ${ipk_arch} 校验通过"
          done

          if [ "$all_ok" != "true" ]; then
            echo ""
            echo "❌ 完整性校验失败，终止提交。"
            exit 1
          fi
          echo ""
          echo "🎉 所有 IPK 校验通过"

      # --------------------------------------------------------
      # 8. 提交并推送到仓库
      # --------------------------------------------------------
      - name: 提交并推送
        if: steps.check.outputs.need_build == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.get_version.outputs.latest_version }}"
          bj_time=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add run/x86_64/xray-core/ run/aarch64/xray-core/

          if git diff --cached --quiet; then
            echo "⏭️  无文件变更，跳过提交。"
          else
            commit_msg="自动更新：Xray-core ${ver}（北京时间 ${bj_time}）"
            git commit -m "$commit_msg"
            git push
            echo "✅ 已推送：${commit_msg}"
          fi

      # --------------------------------------------------------
      # 9. 执行总结
      # --------------------------------------------------------
      - name: 执行总结
        if: always()
        run: |
          echo "============================================"
          echo "工作流执行完毕"
          echo "版本：${{ steps.get_version.outputs.latest_version }}"
          echo "是否构建：${{ steps.check.outputs.need_build }}"
          echo "============================================"
