name: Bandix Openwrt24版本

on:
  schedule:
    - cron: '13 22 * * *'  # 北京时间早上 6 点 13
  workflow_dispatch:      # 支持手动触发

# 防止定时任务与手动触发并发执行导致提交冲突
concurrency:
  group: bandix-repo-build
  cancel-in-progress: false

permissions:
  contents: write   # 允许推送到本仓库
  actions: write    # 允许清理本仓库的 Actions 运行缓存

jobs:
  build:
    name: 构建bandix并提交到本仓库
    runs-on: ubuntu-26.04

    steps:
      - name: 拉取存储库（获取完整历史记录）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装依赖项
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq

      - name: 设置变量
        id: vars
        run: |
          echo "TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "DATE_SHORT=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          mkdir -p run/x86/luci-app-bandix run/arm64/luci-app-bandix

      - name: 获取最新发布信息 - openwrt-bandix
        id: core
        run: |
          CORE_RELEASE=$(curl -fsSL https://api.github.com/repos/timsaya/openwrt-bandix/releases/latest)
          CORE_TAG=$(echo "$CORE_RELEASE" | jq -r '.tag_name')
          if [ -z "$CORE_TAG" ] || [ "$CORE_TAG" = "null" ]; then
            echo "未能获取openwrt-bannix发布信息"
            exit 1
          fi
          echo "CORE_TAG=$CORE_TAG" >> $GITHUB_ENV
          echo "openwrt-bandix 最新版: $CORE_TAG"
          
          # 获取x86_64 ipk (取第一个匹配项，避免多版本干扰)
          CORE_X86_URL=$(echo "$CORE_RELEASE" | jq -r '[.assets[] | select(.name | test("bandix_.*_x86_64\\.ipk$"))] | first | .browser_download_url')
          if [ -z "$CORE_X86_URL" ] || [ "$CORE_X86_URL" = "null" ]; then
            echo "版本中未发现 x86_64 ipk $CORE_TAG"
            exit 1
          fi
          echo "CORE_X86_URL=$CORE_X86_URL" >> $GITHUB_ENV
          CORE_X86_NAME=$(basename "$CORE_X86_URL")
          echo "CORE_X86_NAME=$CORE_X86_NAME" >> $GITHUB_ENV
          
          # 获取aarch64_generic ipk (最通用的arm64版本)
          CORE_ARM64_URL=$(echo "$CORE_RELEASE" | jq -r '[.assets[] | select(.name | test("bandix_.*_aarch64_generic\\.ipk$"))] | first | .browser_download_url')
          if [ -z "$CORE_ARM64_URL" ] || [ "$CORE_ARM64_URL" = "null" ]; then
            echo "版本中未发现 aarch64_generic ipk $CORE_TAG"
            exit 1
          fi
          echo "CORE_ARM64_URL=$CORE_ARM64_URL" >> $GITHUB_ENV
          CORE_ARM64_NAME=$(basename "$CORE_ARM64_URL")
          echo "CORE_ARM64_NAME=$CORE_ARM64_NAME" >> $GITHUB_ENV

      - name: 获取最新发布信息 - luci-app-bandix
        id: luci
        run: |
          LUCI_RELEASE=$(curl -fsSL https://api.github.com/repos/timsaya/luci-app-bandix/releases/latest)
          LUCI_TAG=$(echo "$LUCI_RELEASE" | jq -r '.tag_name')
          if [ -z "$LUCI_TAG" ] || [ "$LUCI_TAG" = "null" ]; then
            echo "未能获取luci-app-banspel发布信息"
            exit 1
          fi
          echo "LUCI_TAG=$LUCI_TAG" >> $GITHUB_ENV
          echo "luci-app-bandix 最新版: $LUCI_TAG"
          
          # luci-app-bandix (all架构，两目录共用)
          LUCI_APP_URL=$(echo "$LUCI_RELEASE" | jq -r '[.assets[] | select(.name | test("^luci-app-bandix_.*_all\\.ipk$"))] | first | .browser_download_url')
          if [ -z "$LUCI_APP_URL" ] || [ "$LUCI_APP_URL" = "null" ]; then
            echo "版本中未发现 luci-app-bandix ipk $LUCI_TAG"
            exit 1
          fi
          echo "LUCI_APP_URL=$LUCI_APP_URL" >> $GITHUB_ENV
          LUCI_APP_NAME=$(basename "$LUCI_APP_URL")
          echo "LUCI_APP_NAME=$LUCI_APP_NAME" >> $GITHUB_ENV
          
          # luci-i18n-bandix-zh-cn (all架构)
          LUCI_I18N_URL=$(echo "$LUCI_RELEASE" | jq -r '[.assets[] | select(.name | test("^luci-i18n-bandix-zh-cn_.*_all\\.ipk$"))] | first | .browser_download_url')
          if [ -z "$LUCI_I18N_URL" ] || [ "$LUCI_I18N_URL" = "null" ]; then
            echo "版本中未发现 luci-i18n-bandix-zh-cn ipk $LUCI_TAG"
            exit 1
          fi
          echo "LUCI_I18N_URL=$LUCI_I18N_URL" >> $GITHUB_ENV
          LUCI_I18N_NAME=$(basename "$LUCI_I18N_URL")
          echo "LUCI_I18N_NAME=$LUCI_I18N_NAME" >> $GITHUB_ENV

      - name: 检查现有版本并决定是否更新
        id: check
        run: |
          UPDATE_NEEDED="false"
          CHANGE_LOG=""
          
          # 检查x86目录
          X86_DIR="run/x86/luci-app-bandix"
          EXISTING_CORE_X86=$(ls "$X86_DIR"/bandix_*.ipk 2>/dev/null | head -1 | xargs -r basename 2>/dev/null || echo "")
          EXISTING_LUCI_X86=$(ls "$X86_DIR"/luci-app-bandix_*.ipk 2>/dev/null | head -1 | xargs -r basename 2>/dev/null || echo "")
          EXISTING_I18N_X86=$(ls "$X86_DIR"/luci-i18n-bandix-zh-cn_*.ipk 2>/dev/null | head -1 | xargs -r basename 2>/dev/null || echo "")
          
          echo "现有 x86 core: ${EXISTING_CORE_X86:-none}"
          echo "现有 x86 luci: ${EXISTING_LUCI_X86:-none}"
          echo "现有 x86 i18n: ${EXISTING_I18N_X86:-none}"
          echo "最新 x86 core: $CORE_X86_NAME"
          echo "最新 luci app: $LUCI_APP_NAME"
          echo "最新 luci i18n: $LUCI_I18N_NAME"
          
          if [ "$EXISTING_CORE_X86" != "$CORE_X86_NAME" ] || \
             [ "$EXISTING_LUCI_X86" != "$LUCI_APP_NAME" ] || \
             [ "$EXISTING_I18N_X86" != "$LUCI_I18N_NAME" ]; then
            UPDATE_NEEDED="true"
            [ "$EXISTING_CORE_X86" != "$CORE_X86_NAME" ] && CHANGE_LOG+="core(x86): ${EXISTING_CORE_X86:-none} -> $CORE_X86_NAME; "
            [ "$EXISTING_LUCI_X86" != "$LUCI_APP_NAME" ] && CHANGE_LOG+="luci-app: ${EXISTING_LUCI_X86:-none} -> $LUCI_APP_NAME; "
            [ "$EXISTING_I18N_X86" != "$LUCI_I18N_NAME" ] && CHANGE_LOG+="luci-i18n-zh-cn: ${EXISTING_I18N_X86:-none} -> $LUCI_I18N_NAME; "
          fi
          
          # 检查arm64目录
          ARM64_DIR="run/arm64/luci-app-bandix"
          EXISTING_CORE_ARM64=$(ls "$ARM64_DIR"/bandix_*.ipk 2>/dev/null | head -1 | xargs -r basename 2>/dev/null || echo "")
          EXISTING_LUCI_ARM64=$(ls "$ARM64_DIR"/luci-app-bandix_*.ipk 2>/dev/null | head -1 | xargs -r basename 2>/dev/null || echo "")
          EXISTING_I18N_ARM64=$(ls "$ARM64_DIR"/luci-i18n-bandix-zh-cn_*.ipk 2>/dev/null | head -1 | xargs -r basename 2>/dev/null || echo "")
          
          echo "现有 arm64 core: ${EXISTING_CORE_ARM64:-none}"
          echo "现有 arm64 luci: ${EXISTING_LUCI_ARM64:-none}"
          echo "现有 arm64 i18n: ${EXISTING_I18N_ARM64:-none}"
          echo "最新 arm64 core: $CORE_ARM64_NAME"
          echo "最新 luci app: $LUCI_APP_NAME"
          echo "最新 luci i18n: $LUCI_I18N_NAME"
          
          if [ "$EXISTING_CORE_ARM64" != "$CORE_ARM64_NAME" ] || \
             [ "$EXISTING_LUCI_ARM64" != "$LUCI_APP_NAME" ] || \
             [ "$EXISTING_I18N_ARM64" != "$LUCI_I18N_NAME" ]; then
            UPDATE_NEEDED="true"
            [ "$EXISTING_CORE_ARM64" != "$CORE_ARM64_NAME" ] && CHANGE_LOG+="core(arm64): ${EXISTING_CORE_ARM64:-none} -> $CORE_ARM64_NAME; "
            [ "$EXISTING_LUCI_ARM64" != "$LUCI_APP_NAME" ] && CHANGE_LOG+="luci-app(arm64): ${EXISTING_LUCI_ARM64:-none} -> $LUCI_APP_NAME; "
            [ "$EXISTING_I18N_ARM64" != "$LUCI_I18N_NAME" ] && CHANGE_LOG+="luci-i18n-zh-cn(arm64): ${EXISTING_I18N_ARM64:-none} -> $LUCI_I18N_NAME; "
          fi
          
          echo "UPDATE_NEEDED=$UPDATE_NEEDED" >> $GITHUB_OUTPUT
          echo "CHANGE_LOG=$CHANGE_LOG" >> $GITHUB_OUTPUT
          
          if [ "$UPDATE_NEEDED" = "true" ]; then
            echo "需要更新！变化: $CHANGE_LOG"
          else
            echo "无需更新-所有文件都是最新的."
          fi

      - name: 删除旧版本文件（仅限于与构建相关的ipk文件）
        if: steps.check.outputs.UPDATE_NEEDED == 'true'
        run: |
          echo "Cleaning old build files..."
          
          # 清理x86旧文件 - 只删除匹配模式的ipk，不删除其他文件
          X86_DIR="run/x86/luci-app-bandix"
          find "$X86_DIR" -maxdepth 1 -type f -name "bandix_*.ipk" ! -name "$CORE_X86_NAME" -delete -print
          find "$X86_DIR" -maxdepth 1 -type f -name "luci-app-bandix_*.ipk" ! -name "$LUCI_APP_NAME" -delete -print
          find "$X86_DIR" -maxdepth 1 -type f -name "luci-i18n-bandix-zh-cn_*.ipk" ! -name "$LUCI_I18N_NAME" -delete -print
          
          # 清理arm64旧文件
          ARM64_DIR="run/arm64/luci-app-bandix"
          find "$ARM64_DIR" -maxdepth 1 -type f -name "bandix_*.ipk" ! -name "$CORE_ARM64_NAME" -delete -print
          find "$ARM64_DIR" -maxdepth 1 -type f -name "luci-app-bandix_*.ipk" ! -name "$LUCI_APP_NAME" -delete -print
          find "$ARM64_DIR" -maxdepth 1 -type f -name "luci-i18n-bandix-zh-cn_*.ipk" ! -name "$LUCI_I18N_NAME" -delete -print
          
          echo "清理后 - x86 dir:"
          ls -la "$X86_DIR"
          echo "清理后 - arm64 dir:"
          ls -la "$ARM64_DIR"

      - name: 下载新文件 (x86)
        if: steps.check.outputs.UPDATE_NEEDED == 'true'
        working-directory: run/x86/luci-app-bandix
        run: |
          echo "下载文件 x86..."
          curl -fsSL -o "$CORE_X86_NAME" "$CORE_X86_URL"
          curl -fsSL -o "$LUCI_APP_NAME" "$LUCI_APP_URL"
          curl -fsSL -o "$LUCI_I18N_NAME" "$LUCI_I18N_URL"
          # 验证文件非空
          for f in "$CORE_X86_NAME" "$LUCI_APP_NAME" "$LUCI_I18N_NAME"; do
            if [ ! -s "$f" ]; then
              echo "下载失败: $f is empty"
              exit 1
            fi
          done
          echo "X86 下载的文件:"
          ls -la

      - name: 下载新文件 (arm64)
        if: steps.check.outputs.UPDATE_NEEDED == 'true'
        working-directory: run/arm64/luci-app-bandix
        run: |
          echo "Downloading arm64 files..."
          curl -fsSL -o "$CORE_ARM64_NAME" "$CORE_ARM64_URL"
          curl -fsSL -o "$LUCI_APP_NAME" "$LUCI_APP_URL"
          curl -fsSL -o "$LUCI_I18N_NAME" "$LUCI_I18N_URL"
          # 验证文件非空
          for f in "$CORE_ARM64_NAME" "$LUCI_APP_NAME" "$LUCI_I18N_NAME"; do
            if [ ! -s "$f" ]; then
              echo "下载失败: $f is empty"
              exit 1
            fi
          done
          echo "ARM64 下载的文件:"
          ls -la

      - name: 提交更新并推送更新到仓库
        if: steps.check.outputs.UPDATE_NEEDED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run/x86/luci-app-bandix/ run/arm64/luci-app-bandix/
          
          # 检查是否有实际变更要提交
          if git diff --cached --quiet; then
            echo "没有实际提交更改（文件相同），跳过推送."
            exit 0
          fi
          
          COMMIT_MSG="chore: update bandix ipk files"$'\n\n'
          COMMIT_MSG+="- openwrt-bandix: $CORE_TAG"$'\n'
          COMMIT_MSG+="- luci-app-bandix: $LUCI_TAG"$'\n'
          COMMIT_MSG+="- Time: $TIMESTAMP"$'\n'
          COMMIT_MSG+="- Changes: ${{ steps.check.outputs.CHANGE_LOG }}"
          
          git commit -m "$COMMIT_MSG"
          git push
          echo "更新成功!"

      - name: 无需更新
        if: steps.check.outputs.UPDATE_NEEDED != 'true'
        run: |
          echo "All files are already up to date. No changes made."
          echo "- openwrt-bandix: $CORE_TAG"
          echo "- luci-app-bandix: $LUCI_TAG"

      - name: 清理运行缓存
        if: always()
        run: |
          echo "正在清理运行缓存..."
          # 删除临时下载的构建文件
          rm -rf /tmp/bandix_* 2>/dev/null || true
          rm -rf /tmp/luci-* 2>/dev/null || true
          # 清理apt缓存
          sudo apt-get clean 2>/dev/null || true
          # 清理工作区git缓存
          git gc --prune=now 2>/dev/null || true
          echo "缓存清理完成."
