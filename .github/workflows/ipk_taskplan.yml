# ============================================================================
# 工作流：自动更新 taskplan IPK 软件包
# 作用：定时 / 手动从上游 release 拉取 openwrt-24.10-x86_64.tar.gz，
#      解压提取 .ipk 文件，通过版本对比决定是否分发，最终提交。
# 说明：本工作流不构建 IPK、不修改 IPK 内部文件、不处理 control 脚本。
# ============================================================================
name: 自动更新 taskplan IPK 软件包

on:
  # 定时触发：每天 UTC 22:21，即北京时间次日 06:21
  schedule:
    - cron: '21 22 * * *'
  # 手动触发：提供 force_update 布尔开关，默认 false
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（true / false）'
        required: false
        default: false
        type: boolean

# 并发控制：同一工作流同一分支不并发，但不取消已进行的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 需要写权限才能推送提交
permissions:
  contents: write

# ---------------------------------------------------------------------------
# 固定配置：不随每次运行变化
# 运行时变量（VERSION / ASSET_URL / FORCE_UPDATE / BUILD_TIME / WORK_DIR /
#           NEED_UPDATE_ARCHS / SKIPPED_ARCHS 等）由步骤通过 $GITHUB_ENV 设置
# ---------------------------------------------------------------------------
env:
  # 上游 release 列表 API
  UPSTREAM_API: https://api.github.com/repos/sirpdboy/luci-app-taskplan/releases
  # 需要下载的上游资产名称
  UPSTREAM_ASSET: openwrt-24.10-x86_64.tar.gz
  # 软件包名称
  PKG_NAME: luci-app-taskplan
  # 在 run/<arch>/ 下的子目录名称
  PKG_DIR_NAME: luci-app-taskplan
  # 时区
  TZ: Asia/Shanghai
  # 架构矩阵：x86_64 复制全部 ipk；aarch64 仅复制 luci-*_all.ipk
  ARCH_MATRIX: |
    [
      {
        "arch": "x86_64",
        "dest_dir": "run/x86_64",
        "only_all": false
      },
      {
        "arch": "aarch64_generic",
        "dest_dir": "run/aarch64",
        "only_all": true
      }
    ]
  # 提交信息模板，${XXX} 由步骤 7 中的 Python 进行替换
  COMMIT_MSG_TEMPLATE: "🔄自动更新 ${PKG_NAME} ${VERSION} | ${BUILD_TIME}(北京时间)"

jobs:
  update-ipk:
    name: 更新 taskplan IPK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------------
      # 步骤 1：检出仓库代码
      # fetch-depth: 0 保证能拿到完整历史，便于后续 git diff 判断变更
      # ---------------------------------------------------------------------
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 输出检出信息
        run: |
          echo "==> 检出仓库代码 开始"
          echo "当前分支: ${{ github.ref }}"
          echo "==> 检出仓库代码 完成"

      # ---------------------------------------------------------------------
      # 步骤 2：获取上游最新版本号
      # 过滤 draft，按 published_at 降序取最新，找到目标资产下载 URL
      # ---------------------------------------------------------------------
      - name: 获取上游最新版本号
        run: |
          echo "==> 获取上游最新版本号 开始"
          python3 <<'PY'
          import json, urllib.request, os

          # 读取固定配置
          api = os.environ["UPSTREAM_API"]
          asset_name = os.environ["UPSTREAM_ASSET"]
          print(f"==> 请求上游 API: {api}")

          # 必须带 User-Agent，否则 GitHub API 会返回 403
          req = urllib.request.Request(api, headers={"User-Agent": "taskplan-ipk-updater"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              releases = json.load(resp)

          # 过滤草稿版本
          releases = [r for r in releases if not r.get("draft")]
          if not releases:
              raise SystemExit("错误：未找到可用的上游 release")

          # 按发布时间降序排序，取最新
          releases.sort(key=lambda r: r.get("published_at") or "", reverse=True)
          release = releases[0]
          tag = release["tag_name"]

          # 去掉 v 前缀得到版本号
          version = tag[1:] if tag.startswith("v") else tag

          # 在 assets 中匹配目标下载 URL
          asset_url = ""
          for asset in release.get("assets", []):
              if asset.get("name") == asset_name:
                  asset_url = asset.get("browser_download_url", "")
                  break

          if not asset_url:
              raise SystemExit(f"错误：未在 release {tag} 中找到资产 {asset_name}")

          print(f"==> 最新 tag: {tag}，解析版本号: {version}")
          print(f"==> 资产下载 URL: {asset_url}")

          # 写入 $GITHUB_ENV，供后续步骤使用
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"VERSION={version}\n")
              f.write(f"ASSET_URL={asset_url}\n")
          PY
          echo "==> 获取上游最新版本号 完成"

      # ---------------------------------------------------------------------
      # 步骤 3：读取触发参数
      # force_update 为 true 时跳过版本对比，强制重新分发
      # ---------------------------------------------------------------------
      - name: 读取触发参数
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: |
          echo "==> 读取触发参数 开始"
          echo "==> 强制更新: $FORCE_UPDATE"
          echo "FORCE_UPDATE=$FORCE_UPDATE" >> "$GITHUB_ENV"
          echo "==> 读取触发参数 完成"

      # ---------------------------------------------------------------------
      # 步骤 4：下载并解压上游资产
      # 校验：下载文件非空 + 解压成功 + 至少提取到一个 .ipk
      # 注意：本步骤只做下载解压，不清理任何目标目录
      # ---------------------------------------------------------------------
      - name: 下载并解压上游资产
        run: |
          echo "==> 下载并解压上游资产 开始"
          WORK_DIR="/tmp/taskplan-build"
          DOWNLOAD_FILE="$WORK_DIR/$UPSTREAM_ASSET"
          EXTRACT_DIR="$WORK_DIR/extract"

          # 清理并重建临时目录
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR" "$EXTRACT_DIR"

          echo "==> 下载 URL: $ASSET_URL"
          echo "==> 保存路径: $DOWNLOAD_FILE"

          # 下载（带 User-Agent），失败则显式 exit 1
          curl -L -H "User-Agent: taskplan-ipk-updater" -o "$DOWNLOAD_FILE" "$ASSET_URL" || {
            echo "错误：下载上游资产失败" >&2
            exit 1
          }

          # 校验下载文件存在且非空
          [ -s "$DOWNLOAD_FILE" ] || {
            echo "错误：下载文件为空" >&2
            exit 1
          }

          echo "==> 下载文件大小: $(du -h "$DOWNLOAD_FILE" | awk '{print $1}')"

          # 解压
          tar -xzf "$DOWNLOAD_FILE" -C "$EXTRACT_DIR" || {
            echo "错误：解压上游资产失败" >&2
            exit 1
          }

          echo "==> 解压目录: $EXTRACT_DIR"
          echo "==> 发现的 .ipk 文件:"
          find "$EXTRACT_DIR" -type f -name '*.ipk' -print

          # 确认至少有一个 ipk，否则报错
          IPK_COUNT=$(find "$EXTRACT_DIR" -type f -name '*.ipk' | wc -l)
          [ "$IPK_COUNT" -gt 0 ] || {
            echo "错误：压缩包内未找到任何 .ipk 文件" >&2
            exit 1
          }

          # 写入 $GITHUB_ENV
          {
            echo "WORK_DIR=$WORK_DIR"
            echo "DOWNLOAD_FILE=$DOWNLOAD_FILE"
            echo "EXTRACT_DIR=$EXTRACT_DIR"
          } >> "$GITHUB_ENV"

          echo "==> 下载并解压上游资产 完成"

      # ---------------------------------------------------------------------
      # 步骤 5：版本对比检查
      # 通过“本次解压得到的 .ipk 文件名集合”与“目标目录现有 .ipk 文件名集合”
      # 是否一致来判断是否需要更新：
      #   - force_update=true：强制标记为需要更新
      #   - 集合完全一致：跳过该架构，不清理、不复制
      #   - 目标目录不存在 / 为空 / 集合不一致：需要更新
      # 结果写入 NEED_UPDATE_ARCHS 与 SKIPPED_ARCHS
      # ---------------------------------------------------------------------
      - name: 版本对比检查
        run: |
          echo "==> 版本对比检查 开始"
          python3 <<'PY'
          import json, os, glob

          matrix = json.loads(os.environ["ARCH_MATRIX"])
          extract_dir = os.environ["EXTRACT_DIR"]
          pkg_dir_name = os.environ["PKG_DIR_NAME"]
          force_update = os.environ.get("FORCE_UPDATE", "false").lower() == "true"
          version = os.environ.get("VERSION", "")

          print(f"==> 上游版本: {version}")
          print(f"==> 强制更新: {force_update}")

          # 本次解压得到的全部 .ipk
          ipks = glob.glob(os.path.join(extract_dir, "**", "*.ipk"), recursive=True)
          print(f"==> 解压目录共发现 {len(ipks)} 个 .ipk 文件")

          need_update_archs = []
          skipped_archs = []

          for item in matrix:
              arch = item["arch"]
              dest_dir = item["dest_dir"]
              only_all = item["only_all"]
              target_dir = os.path.join(dest_dir, pkg_dir_name)

              # 按 only_all 规则筛选本次选中文件名集合
              selected_set = set()
              for src in ipks:
                  base = os.path.basename(src)
                  if only_all and not (base.startswith("luci-") and base.endswith("_all.ipk")):
                      continue
                  selected_set.add(base)

              # 收集目标目录现有 .ipk 文件名集合
              existing_set = set()
              if os.path.isdir(target_dir):
                  existing_set = {os.path.basename(p)
                                  for p in glob.glob(os.path.join(target_dir, "*.ipk"))}

              print(f"==> 架构: {arch}")
              print(f"==> DEST_DIR: {dest_dir}")
              print(f"==> ONLY_ALL: {only_all}")
              print(f"==> 目标目录: {target_dir}")
              print(f"==> 本次选中文件: {sorted(selected_set)}")
              print(f"==> 现有文件: {sorted(existing_set)}")

              # 未匹配到任何文件：x86_64 必须报错；其它架构跳过
              if not selected_set:
                  if arch == "x86_64":
                      raise SystemExit(f"错误：架构 {arch} 未匹配到任何 .ipk 文件")
                  print(f"警告：架构 {arch} 未匹配到任何 .ipk 文件，标记为跳过")
                  skipped_archs.append(arch)
                  continue

              # 版本对比判断
              if force_update:
                  print(f"==> 架构 {arch} 因 force_update=true 需要更新")
                  need_update_archs.append(arch)
              elif existing_set == selected_set:
                  print(f"==> 架构 {arch} 文件集合一致，跳过更新")
                  skipped_archs.append(arch)
              else:
                  print(f"==> 架构 {arch} 文件集合不一致，需要更新")
                  need_update_archs.append(arch)

          # 写入 $GITHUB_ENV，供后续步骤使用
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("NEED_UPDATE_ARCHS=" + " ".join(need_update_archs) + "\n")
              f.write("SKIPPED_ARCHS=" + " ".join(skipped_archs) + "\n")

          print(f"==> 需要更新的架构: {need_update_archs}")
          print(f"==> 跳过的架构: {skipped_archs}")
          PY
          echo "==> 版本对比检查 完成"

      # ---------------------------------------------------------------------
      # 步骤 6：分发 .ipk 到提交目录
      # - 仅处理 NEED_UPDATE_ARCHS 中的架构
      # - 下载解压成功且版本对比完成后才清理旧文件，避免误删
      # - aarch64 只保留 luci-*_all.ipk（全架构包，每个架构各放一份）
      # ---------------------------------------------------------------------
      - name: 分发 .ipk 到提交目录
        run: |
          echo "==> 分发 .ipk 到提交目录 开始"
          python3 <<'PY'
          import json, os, glob, shutil

          matrix = json.loads(os.environ["ARCH_MATRIX"])
          extract_dir = os.environ["EXTRACT_DIR"]
          pkg_dir_name = os.environ["PKG_DIR_NAME"]
          need_update_archs = os.environ.get("NEED_UPDATE_ARCHS", "").split()

          print(f"==> 需要更新的架构: {need_update_archs}")

          # 若无需更新任何架构，直接跳过整个分发流程
          if not need_update_archs:
              print("==> 无需要更新的架构，跳过分发")
              raise SystemExit(0)

          # 递归查找解压目录中的全部 .ipk
          ipks = glob.glob(os.path.join(extract_dir, "**", "*.ipk"), recursive=True)
          print(f"==> 共发现 {len(ipks)} 个 .ipk 文件")

          summary_lines = []
          for item in matrix:
              arch = item["arch"]
              dest_dir = item["dest_dir"]
              only_all = item["only_all"]
              target_dir = os.path.join(dest_dir, pkg_dir_name)

              # 仅处理需要更新的架构
              if arch not in need_update_archs:
                  print(f"==> 架构 {arch} 无需更新，跳过")
                  summary_lines.append(f"- {arch} -> {target_dir}: 跳过（无需更新）")
                  continue

              print(f"==> 处理架构: {arch}")
              print(f"==> 目标目录: {target_dir}")
              print(f"==> ONLY_ALL: {only_all}")

              # 按规则筛选
              selected = []
              for src in ipks:
                  base = os.path.basename(src)
                  if only_all and not (base.startswith("luci-") and base.endswith("_all.ipk")):
                      continue
                  selected.append(src)

              if not selected:
                  # x86_64 必须至少匹配到一个文件；其它架构可跳过
                  if arch == "x86_64":
                      raise SystemExit(f"错误：架构 {arch} 未匹配到任何 .ipk 文件")
                  print(f"警告：架构 {arch} 未匹配到任何 .ipk 文件，跳过清理与复制")
                  summary_lines.append(f"- {arch} -> {target_dir}: 0 个文件（跳过）")
                  continue

              os.makedirs(target_dir, exist_ok=True)

              # 先清理目标目录中的旧 .ipk，再复制新文件
              old_files = glob.glob(os.path.join(target_dir, "*.ipk"))
              for old in old_files:
                  os.remove(old)
                  print(f"==> 已清理旧文件: {old}")

              # 复制时保留原文件名
              for src in selected:
                  base = os.path.basename(src)
                  dst = os.path.join(target_dir, base)
                  shutil.copy2(src, dst)
                  print(f"==> 已复制: {src} -> {dst}")

              print(f"==> 架构 {arch} 完成，复制 {len(selected)} 个文件")
              summary_lines.append(f"- {arch} -> {target_dir}: {len(selected)} 个文件")

          # 写一份架构级明细，供步骤 8 结果总结使用
          with open("/tmp/taskplan-build/arch-summary.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(summary_lines) + "\n")
          PY
          echo "==> 分发 .ipk 到提交目录 完成"

      # ---------------------------------------------------------------------
      # 步骤 7：提交并推送
      # - BUILD_TIME 使用北京时间
      # - 无变更时跳过提交，避免空提交
      # ---------------------------------------------------------------------
      - name: 提交并推送
        run: |
          echo "==> 提交并推送 开始"

          # 生成北京时间
          BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          export BUILD_TIME
          echo "==> 构建时间: $BUILD_TIME"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

          # 用 Python 替换提交信息模板中的变量
          COMMIT_MSG=$(python3 - <<'PY'
          import os
          tpl = os.environ["COMMIT_MSG_TEMPLATE"]
          msg = tpl.replace("${PKG_NAME}", os.environ["PKG_NAME"])
          msg = msg.replace("${VERSION}", os.environ["VERSION"])
          msg = msg.replace("${BUILD_TIME}", os.environ["BUILD_TIME"])
          print(msg)
          PY
          )

          echo "==> 提交信息: $COMMIT_MSG"

          # 配置 git 提交身份
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 暂存产物目录
          git add run/

          # 判断是否存在变更，无变更则跳过提交
          if git diff --cached --quiet; then
            echo "==> 无变更，跳过提交"
          else
            git commit -m "$COMMIT_MSG"
            git push
            echo "==> 已推送提交"
          fi

          echo "==> 提交并推送 完成"

      # ---------------------------------------------------------------------
      # 步骤 8：结果总结
      # 使用 $GITHUB_STEP_SUMMARY 输出本次更新汇总
      # ---------------------------------------------------------------------
      - name: 结果总结
        run: |
          echo "==> 结果总结 开始"

          ARCH_SUMMARY=""
          if [ -f /tmp/taskplan-build/arch-summary.txt ]; then
            ARCH_SUMMARY=$(cat /tmp/taskplan-build/arch-summary.txt)
          fi

          {
            echo "## taskplan IPK 自动更新结果"
            echo ""
            echo "- 上游版本: $VERSION"
            echo "- 下载资产: $UPSTREAM_ASSET"
            echo "- 下载 URL: $ASSET_URL"
            echo "- 强制更新: $FORCE_UPDATE"
            echo "- 需要更新的架构: ${NEED_UPDATE_ARCHS:-无}"
            echo "- 跳过的架构: ${SKIPPED_ARCHS:-无}"
            echo "- 构建时间: $BUILD_TIME"
            echo "- x86_64 目录: run/x86_64/$PKG_DIR_NAME"
            echo "- aarch64 目录: run/aarch64/$PKG_DIR_NAME"
            echo ""
            echo "### 架构分发明细"
            echo ""
            echo "$ARCH_SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "==> 结果总结 完成"

      # ---------------------------------------------------------------------
      # 步骤 9：清理缓存和临时文件
      # 始终执行，避免残留临时目录
      # ---------------------------------------------------------------------
      - name: 清理缓存和临时文件
        if: always()
        run: |
          echo "==> 清理缓存和临时文件 开始"
          rm -rf /tmp/taskplan-build
          echo "==> 已清理: /tmp/taskplan-build"
          echo "==> 清理缓存和临时文件 完成"