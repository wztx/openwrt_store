name: 自动构建 sing-box IPK 安装包

on:
  schedule:
    # 每天 UTC 22:05（北京时间次日 06:05）触发
    - cron: '5 22 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: '强制更新（递增发行号）'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_API: https://api.github.com/repos/SagerNet/sing-box/releases/latest
  PKG_NAME: sing-box
  PKG_DIR_NAME: sing-box
  TZ: Asia/Shanghai
  ARCH_MATRIX: |
    [
      {
        "arch": "x86_64",
        "asset_regex": "^sing-box_.*_x86_64\\.ipk$",
        "extract": "sing-box",
        "dest_dir": "run/x86_64",
        "control_arch": "x86_64"
      },
      {
        "arch": "aarch64_generic",
        "asset_regex": "^sing-box_.*_aarch64_generic\\.ipk$",
        "extract": "sing-box",
        "dest_dir": "run/aarch64",
        "control_arch": "aarch64_generic"
      }
    ]
  COMMIT_MSG_TEMPLATE: "🔄自动构建 ${PKG_NAME}_${VERSION}-${RELEASE} | ${BUILD_TIME}(北京时间)"

jobs:
  build:
    name: 构建 sing-box IPK
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 输出检出仓库代码日志
        run: |
          echo "==> 检出仓库代码 开始"
          echo "当前分支: ${{ github.ref }}"
          echo "==> 检出仓库代码 完成"

      - name: 获取上游最新版本号
        run: |
          echo "==> 获取上游最新版本号 开始"
          python3 - <<'PY'
          import json, os, sys, urllib.request

          api = os.environ["UPSTREAM_API"]
          print(f"==> 请求上游 API: {api}")

          req = urllib.request.Request(api, headers={"User-Agent": "sing-box-ipk-builder"})
          with urllib.request.urlopen(req) as resp:
              release = json.load(resp)

          if release.get("draft"):
              print("错误：上游最新发布为 draft", file=sys.stderr)
              sys.exit(1)

          tag = release["tag_name"]
          version = tag[1:] if tag.startswith("v") else tag
          print(f"==> 最新 tag: {tag}，解析版本号: {version}")

          release_json = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "sing-box-release.json")
          with open(release_json, "w", encoding="utf-8") as f:
              json.dump(release, f, ensure_ascii=False)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VERSION={version}\n")
              f.write(f"RELEASE_JSON={release_json}\n")
          PY
          echo "==> 获取上游最新版本号 完成"

      - name: 读取触发参数
        run: |
          echo "==> 读取触发参数 开始"
          FORCE_UPDATE="${{ github.event.inputs.force_update || 'false' }}"
          echo "FORCE_UPDATE=$FORCE_UPDATE" >> "$GITHUB_ENV"
          echo "==> 强制更新: $FORCE_UPDATE"
          echo "==> 读取触发参数 完成"

      - name: 版本对比检查
        run: |
          echo "==> 版本对比检查 开始"
          python3 - <<'PY'
          import glob, json, os, re

          arch_matrix = json.loads(os.environ["ARCH_MATRIX"])
          version = os.environ["VERSION"]
          force = os.environ.get("FORCE_UPDATE", "false") == "true"
          pkg_name = os.environ["PKG_NAME"]
          pkg_dir_name = os.environ["PKG_DIR_NAME"]

          plan = []

          for item in arch_matrix:
              arch = item["arch"]
              dest_dir = item["dest_dir"]
              target_dir = os.path.join(dest_dir, pkg_dir_name)
              pattern = os.path.join(target_dir, f"{pkg_name}_{version}-*_{arch}.ipk")
              files = glob.glob(pattern)

              if files and not force:
                  print(f"==> 架构 {arch}: 已存在同版本文件，跳过")
                  continue

              if force and files:
                  releases = []
                  for f in files:
                      base = os.path.basename(f)
                      m = re.search(
                          rf"{re.escape(pkg_name)}_{re.escape(version)}-(\d+)_{re.escape(arch)}\.ipk$",
                          base
                      )
                      if m:
                          releases.append(int(m.group(1)))
                  release = max(releases) + 1 if releases else 1
              else:
                  release = 1

              row = dict(item)
              row["release"] = release
              plan.append(row)
              print(f"==> 架构 {arch}: 计划构建，发行号 {release}")

          build_plan = "/tmp/sing-box-build-plan.json"
          with open(build_plan, "w", encoding="utf-8") as f:
              json.dump(plan, f, ensure_ascii=False)

          global_release = max((i["release"] for i in plan), default=1)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"BUILD_PLAN={build_plan}\n")
              f.write("BUILD_ARCHS=" + " ".join(i["arch"] for i in plan) + "\n")
              f.write(f"RELEASE={global_release}\n")
          PY
          echo "==> 版本对比检查 完成"

      - name: 匹配并下载上游 IPK 文件 URL
        run: |
          echo "==> 匹配并下载上游 IPK 文件 URL 开始"
          python3 - <<'PY'
          import json, os, re, sys

          release = json.load(open(os.environ["RELEASE_JSON"], encoding="utf-8"))
          plan = json.load(open(os.environ["BUILD_PLAN"], encoding="utf-8"))

          if not plan:
              print("==> 无待构建架构，跳过匹配")
              sys.exit(0)

          for item in plan:
              matches = [a for a in release["assets"] if re.match(item["asset_regex"], a["name"])]
              if not matches:
                  print(f"错误：架构 {item['arch']} 未找到匹配资产：{item['asset_regex']}", file=sys.stderr)
                  sys.exit(1)

              asset = matches[0]
              item["asset_name"] = asset["name"]
              item["download_url"] = asset["browser_download_url"]

              print(f"==> 架构 {item['arch']} 匹配资产: {asset['name']}")
              print(f"==> 下载 URL: {asset['browser_download_url']}")

          with open(os.environ["BUILD_PLAN"], "w", encoding="utf-8") as f:
              json.dump(plan, f, ensure_ascii=False)
          PY
          echo "==> 匹配并下载上游 IPK 文件 URL 完成"

      - name: 从上游 IPK 提取二进制并构建新 IPK 安装包
        run: |
          echo "==> 从上游 IPK 提取二进制并构建新 IPK 安装包 开始"
          BUILD_TIME=$(date +"%Y-%m-%d %H:%M:%S")
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"

          if [ ! -f "$BUILD_PLAN" ]; then
            echo "错误：构建计划文件不存在: $BUILD_PLAN" >&2
            exit 1
          fi

          plan_count=$(jq 'length' "$BUILD_PLAN")
          if [ "$plan_count" -eq 0 ]; then
            echo "==> 构建计划为空，跳过构建"
            echo "==> 从上游 IPK 提取二进制并构建新 IPK 安装包 完成"
            exit 0
          fi

          while IFS= read -r item; do
            arch=$(echo "$item" | jq -r '.arch')
            dest_dir=$(echo "$item" | jq -r '.dest_dir')
            control_arch=$(echo "$item" | jq -r '.control_arch')
            release=$(echo "$item" | jq -r '.release')
            asset_name=$(echo "$item" | jq -r '.asset_name')
            download_url=$(echo "$item" | jq -r '.download_url')

            echo "==> 构建 $arch 的 IPK: ${PKG_NAME}_${VERSION}-${release}_${arch}.ipk"
            echo "==> 上游资产: $asset_name"
            echo "==> 下载 URL: $download_url"

            WORK_DIR="/tmp/sing-box-build/${arch}"
            rm -rf "$WORK_DIR"
            mkdir -p "$WORK_DIR/upstream-ipk" "$WORK_DIR/upstream-data" "$WORK_DIR/stage/data/usr/bin" "$WORK_DIR/stage/control"

            DOWNLOADED_IPK="$WORK_DIR/upstream.ipk"
            curl -L -H "User-Agent: sing-box-ipk-builder" -o "$DOWNLOADED_IPK" "$download_url" || { echo "错误：下载失败" >&2; exit 1; }
            file_size=$(stat -c%s "$DOWNLOADED_IPK")
            echo "==> 下载完成，文件大小: $file_size 字节"

            tar -xzf "$DOWNLOADED_IPK" -C "$WORK_DIR/upstream-ipk" || { echo "错误：解压上游 IPK 外层失败" >&2; exit 1; }
            tar -xzf "$WORK_DIR/upstream-ipk/data.tar.gz" -C "$WORK_DIR/upstream-data" || { echo "错误：解压上游 data.tar.gz 失败" >&2; exit 1; }

            bin="$WORK_DIR/upstream-data/usr/bin/sing-box"
            [ -f "$bin" ] || { echo "错误：上游 IPK 中未找到 usr/bin/sing-box" >&2; exit 1; }

            magic=$(od -An -tx1 -N4 "$bin" | tr -d ' \n')
            if [ "$magic" != "7f454c46" ]; then
              echo "错误：ELF 头校验失败，magic=$magic" >&2
              exit 1
            fi
            echo "==> ELF 头校验通过: $magic"

            cp "$bin" "$WORK_DIR/stage/data/usr/bin/sing-box" || { echo "错误：复制二进制失败" >&2; exit 1; }
            chmod 755 "$WORK_DIR/stage/data/usr/bin/sing-box" || true

            INSTALLED_SIZE=$(du -k -s "$WORK_DIR/stage/data/usr/bin/sing-box" | awk '{print $1}')
            echo "==> INSTALLED_SIZE: $INSTALLED_SIZE KB"

            # 使用 printf 生成 control 文件（避免 heredoc 在 YAML 多行缩进下的结束符匹配问题）
            {
              printf 'Package: %s\n' "$PKG_NAME"
              printf 'Version: %s-%s\n' "$VERSION" "$release"
              printf 'Depends: libc\n'
              printf 'Source: https://github.com/SagerNet/sing-box\n'
              printf 'SourceName: %s\n' "$PKG_NAME"
              printf 'License: GPL-3.0\n'
              printf 'Section: net\n'
              printf 'Priority: optional\n'
              printf 'Architecture: %s\n' "$control_arch"
              printf 'Installed-Size: %s\n' "$INSTALLED_SIZE"
              printf 'Maintainer: OpenWrt <openwrt@example.com>\n'
              printf 'Description: sing-box is a universal proxy platform.\n'
            } > "$WORK_DIR/stage/control/control" || { echo "错误：生成 control 文件失败" >&2; exit 1; }

            # 使用 printf 生成 postinst 文件（IPKG_INSTROOT 短路、chmod 容错）
            {
              printf '#!/bin/sh\n'
              printf '[ -n "$IPKG_INSTROOT" ] && exit 0\n'
              printf 'chmod 755 /usr/bin/sing-box || true\n'
              printf 'exit 0\n'
            } > "$WORK_DIR/stage/control/postinst" || { echo "错误：生成 postinst 文件失败" >&2; exit 1; }
            chmod 755 "$WORK_DIR/stage/control/postinst" || true

            (cd "$WORK_DIR/stage/data" && tar --format=gnu --numeric-owner --owner=0 --group=0 --sort=name --mtime="$TIMESTAMP" -I 'gzip -n' -cf ../data.tar.gz .) || { echo "错误：打包 data.tar.gz 失败" >&2; exit 1; }
            (cd "$WORK_DIR/stage/control" && tar --format=gnu --numeric-owner --owner=0 --group=0 --sort=name --mtime="$TIMESTAMP" -I 'gzip -n' -cf ../control.tar.gz .) || { echo "错误：打包 control.tar.gz 失败" >&2; exit 1; }

            printf '2.0\n' > "$WORK_DIR/stage/debian-binary"

            # 记录仓库根目录的绝对路径，避免 cd 造成相对路径漂移
            REPO_ROOT="$(pwd)"

            PKG_FILE="${PKG_NAME}_${VERSION}-${release}_${arch}.ipk"

            # 用 pushd/popd 限定当前目录，确保外层 tar 的成员路径前缀正确
            pushd "$WORK_DIR/stage" >/dev/null
            tar --format=gnu --numeric-owner --owner=0 --group=0 \
              --sort=name --mtime="$TIMESTAMP" -I 'gzip -n' -cf "$PKG_FILE" \
              ./debian-binary ./data.tar.gz ./control.tar.gz || \
              { echo "错误：外层打包失败" >&2; popd >/dev/null; exit 1; }
            popd >/dev/null

            # 使用绝对路径定位目标目录，防止路径漂移
            DEST_FULL="$REPO_ROOT/$dest_dir/$PKG_DIR_NAME"
            mkdir -p "$DEST_FULL"
            mv "$WORK_DIR/stage/$PKG_FILE" "$DEST_FULL/$PKG_FILE" || \
              { echo "错误：移动 IPK 文件失败" >&2; exit 1; }
            echo "==> 构建完成: $DEST_FULL/$PKG_FILE"
          done < <(jq -c '.[]' "$BUILD_PLAN")

          echo "==> 从上游 IPK 提取二进制并构建新 IPK 安装包 完成"

      - name: IPK 完整性校验
        run: |
          echo "==> IPK 完整性校验 开始"
          if [ ! -f "$BUILD_PLAN" ]; then
            echo "错误：构建计划文件不存在" >&2
            exit 1
          fi
          plan_count=$(jq 'length' "$BUILD_PLAN")
          if [ "$plan_count" -eq 0 ]; then
            echo "==> 构建计划为空，跳过校验"
            echo "==> IPK 完整性校验 完成"
            exit 0
          fi

          while IFS= read -r item; do
            arch=$(echo "$item" | jq -r '.arch')
            dest_dir=$(echo "$item" | jq -r '.dest_dir')
            release=$(echo "$item" | jq -r '.release')
            PKG_FILE="${PKG_NAME}_${VERSION}-${release}_${arch}.ipk"
            PKG_PATH="$dest_dir/$PKG_DIR_NAME/$PKG_FILE"

            echo "==> 校验 $PKG_PATH"
            if [ ! -f "$PKG_PATH" ]; then
              echo "错误：找不到生成的 IPK: $PKG_PATH" >&2
              exit 1
            fi

            echo "==> 外层成员顺序:"
            tar -tzf "$PKG_PATH" | head -n 3

            rm -rf /tmp/ipk-test
            mkdir -p /tmp/ipk-test
            tar -xzf "$PKG_PATH" -C /tmp/ipk-test || { echo "错误：解压 IPK 失败" >&2; exit 1; }
            mkdir -p /tmp/ipk-test/control
            tar -xzf /tmp/ipk-test/control.tar.gz -C /tmp/ipk-test/control || { echo "错误：解压 control.tar.gz 失败" >&2; exit 1; }

            IPKG_INSTROOT=/tmp/ipk-test sh /tmp/ipk-test/control/postinst
            postinst_ret=$?
            echo "==> postinst 返回值: $postinst_ret"
            if [ "$postinst_ret" -ne 0 ]; then
              echo "错误：postinst 执行失败" >&2
              exit 1
            fi

            mkdir -p /tmp/ipk-test/data
            tar -xzf /tmp/ipk-test/data.tar.gz -C /tmp/ipk-test/data || { echo "错误：解压 data.tar.gz 失败" >&2; exit 1; }
            bin="/tmp/ipk-test/data/usr/bin/sing-box"
            if [ ! -f "$bin" ]; then
              echo "错误：IPK 中未找到 usr/bin/sing-box" >&2
              exit 1
            fi
            magic=$(od -An -tx1 -N4 "$bin" | tr -d ' \n')
            if [ "$magic" != "7f454c46" ]; then
              echo "错误：ELF 头校验失败" >&2
              exit 1
            fi
            echo "==> ELF 头校验通过: $magic"
          done < <(jq -c '.[]' "$BUILD_PLAN")

          echo "==> IPK 完整性校验 完成"

      - name: 清理旧版本文件
        run: |
          echo "==> 清理旧版本文件 开始"
          if [ ! -f "$BUILD_PLAN" ]; then
            echo "==> 无构建计划，跳过清理"
            echo "==> 清理旧版本文件 完成"
            exit 0
          fi
          plan_count=$(jq 'length' "$BUILD_PLAN")
          if [ "$plan_count" -eq 0 ]; then
            echo "==> 构建计划为空，跳过清理"
            echo "==> 清理旧版本文件 完成"
            exit 0
          fi

          while IFS= read -r item; do
            arch=$(echo "$item" | jq -r '.arch')
            dest_dir=$(echo "$item" | jq -r '.dest_dir')
            release=$(echo "$item" | jq -r '.release')
            target_dir="$dest_dir/$PKG_DIR_NAME"
            keep_file="${PKG_NAME}_${VERSION}-${release}_${arch}.ipk"

            if [ ! -d "$target_dir" ]; then
              continue
            fi

            for f in "$target_dir"/*.ipk; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              case "$base" in
                "$keep_file") ;;
                "${PKG_NAME}_"*"_${arch}.ipk")
                  echo "==> 删除旧文件: $f"
                  rm -f "$f"
                  ;;
                *) ;;
              esac
            done
          done < <(jq -c '.[]' "$BUILD_PLAN")

          echo "==> 清理旧版本文件 完成"

      - name: 提交并推送
        run: |
          echo "==> 提交并推送 开始"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add run/
          if git diff --cached --quiet; then
            echo "==> 无变更，跳过提交"
          else
            BUILD_TIME="${BUILD_TIME:-$(date +"%Y-%m-%d %H:%M:%S")}"
            COMMIT_MSG=$(echo "$COMMIT_MSG_TEMPLATE" | sed "s/\${PKG_NAME}/${PKG_NAME}/g; s/\${VERSION}/${VERSION}/g; s/\${RELEASE}/${RELEASE}/g; s/\${BUILD_TIME}/${BUILD_TIME}/g")
            echo "==> 提交信息: $COMMIT_MSG"
            git commit -m "$COMMIT_MSG"
            git push
            echo "==> 推送完成"
          fi
          echo "==> 提交并推送 完成"

      - name: 结果总结
        run: |
          echo "==> 结果总结 开始"
          echo "## 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 版本 | 发行号 | 架构 | 文件路径 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$BUILD_PLAN" ]; then
            plan_count=$(jq 'length' "$BUILD_PLAN")
            if [ "$plan_count" -gt 0 ]; then
              while IFS= read -r item; do
                arch=$(echo "$item" | jq -r '.arch')
                dest_dir=$(echo "$item" | jq -r '.dest_dir')
                release=$(echo "$item" | jq -r '.release')
                file="${PKG_NAME}_${VERSION}-${release}_${arch}.ipk"
                path="$dest_dir/$PKG_DIR_NAME/$file"
                echo "| ${VERSION} | ${release} | ${arch} | ${path} |" >> "$GITHUB_STEP_SUMMARY"
              done < <(jq -c '.[]' "$BUILD_PLAN")
            else
              echo "| - | - | - | 无构建 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "| - | - | - | 无构建计划 |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "==> 结果总结 完成"

      - name: 清理缓存和临时文件
        run: |
          echo "==> 清理缓存和临时文件 开始"
          rm -rf /tmp/sing-box-build /tmp/ipk-test
          [ -n "$RELEASE_JSON" ] && rm -f "$RELEASE_JSON"
          [ -n "$BUILD_PLAN" ] && rm -f "$BUILD_PLAN"
          echo "==> 清理完成"
          echo "==> 清理缓存和临时文件 完成"