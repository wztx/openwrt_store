# ============================================================
# sing-box OpenWrt IPK 自动构建与同步工作流（修正版）
# 功能：每日定时检查上游最新版本，自动构建 x86_64 / aarch64 架构 IPK 包
# 环境：OpenWrt 24.10
# 外层格式：tar.gz（含 debian-binary / control.tar.gz / data.tar.gz）
# ============================================================

name: sing-box IPK 自动构建同步

on:
  schedule:
    - cron: '5 22 * * *'	# 定时触发：每天 UTC 22:05（北京时间 06:05）
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查直接重新构建）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: 'sing-box-ipk-build'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: 检查并构建 IPK 安装包
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      UPSTREAM_API: "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
      UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      PKG_NAME: "sing-box"
      PKG_RELEASE: "1"
      OUT_DIR_AMD64: "run/x86_64/sing-box"
      OUT_DIR_AARCH64: "run/aarch64/sing-box"

    steps:
      - name: 签出仓库代码
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 获取上游最新版本
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          echo "正在请求上游版本信息..."
          # 将 API 响应写入临时文件后用 grep 读取，彻底规避管道 SIGPIPE+pipefail 陷阱
          RESP_FILE="$(mktemp)"
          trap 'rm -f "$RESP_FILE"' EXIT
          curl -sL --fail --retry 3 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: ${{ env.UA }}" \
            -o "$RESP_FILE" \
            "${{ env.UPSTREAM_API }}"

          # grep 直接读文件，无管道生产者，不存在 SIGPIPE 问题
          LATEST_TAG="$(grep -m1 -oP '"tag_name":\s*"\K[^"]+' "$RESP_FILE")"
          LATEST_VER="${LATEST_TAG#v}"
          echo "上游最新版本: ${LATEST_VER}"
          if [ -z "$LATEST_VER" ]; then
            echo "::error::获取版本号失败"
            exit 1
          fi

          AMD64_URL="$(grep -m1 -oP '"browser_download_url":\s*"\K[^"]+sing-box-[^"]+-linux-amd64\.tar\.gz' "$RESP_FILE")"
          AARCH64_URL="$(grep -m1 -oP '"browser_download_url":\s*"\K[^"]+sing-box_[^"]+_linux_aarch64\.pkg\.tar\.zst' "$RESP_FILE")"

          if [ -z "$AMD64_URL" ]; then
            echo "::error::未找到 amd64 二进制包下载链接"
            exit 1
          fi
          if [ -z "$AARCH64_URL" ]; then
            echo "::error::未找到 aarch64 二进制包下载链接"
            exit 1
          fi
          echo "amd64 链接: ${AMD64_URL}"
          echo "aarch64 链接: ${AARCH64_URL}"

          echo "latest_ver=${LATEST_VER}" >> "$GITHUB_OUTPUT"
          echo "amd64_url=${AMD64_URL}" >> "$GITHUB_OUTPUT"
          echo "aarch64_url=${AARCH64_URL}" >> "$GITHUB_OUTPUT"

      - name: 版本对比检查
        id: check_skip
        shell: bash
        run: |
          set -e
          FORCE="${{ github.event.inputs.force_update }}"
          VER="${{ steps.get_version.outputs.latest_ver }}"
          IPK_AMD64="${{ env.OUT_DIR_AMD64 }}/${{ env.PKG_NAME }}_${VER}-${{ env.PKG_RELEASE }}_x86_64.ipk"
          IPK_AARCH64="${{ env.OUT_DIR_AARCH64 }}/${{ env.PKG_NAME }}_${VER}-${{ env.PKG_RELEASE }}_aarch64.ipk"
          echo "目标文件 x86_64: ${IPK_AMD64}"
          echo "目标文件 aarch64: ${IPK_AARCH64}"
          if [ "$FORCE" = "true" ]; then
            echo "手动触发强制更新，跳过版本检查"
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          elif [ -f "$IPK_AMD64" ] && [ -f "$IPK_AARCH64" ]; then
            echo "两个架构的 ${VER} 版本 IPK 均已存在，跳过构建"
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "发现新版本 ${VER}，开始构建"
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ipk_amd64=${IPK_AMD64}" >> "$GITHUB_OUTPUT"
          echo "ipk_aarch64=${IPK_AARCH64}" >> "$GITHUB_OUTPUT"

      - name: 下载并构建 IPK 包
        if: steps.check_skip.outputs.should_skip == 'false'
        id: build
        shell: bash
        env:
          VER: ${{ steps.get_version.outputs.latest_ver }}
          AMD64_URL: ${{ steps.get_version.outputs.amd64_url }}
          AARCH64_URL: ${{ steps.get_version.outputs.aarch64_url }}
          TARGET_IPK_AMD64: ${{ steps.check_skip.outputs.ipk_amd64 }}
          TARGET_IPK_AARCH64: ${{ steps.check_skip.outputs.ipk_aarch64 }}
        run: |
          set -euo pipefail

          TMPDIR="$(mktemp -d)"
          CLEANED="false"
          cleanup() {
            if [ "$CLEANED" = "false" ]; then
              CLEANED="true"
              echo "正在清理临时目录: ${TMPDIR}"
              rm -rf "$TMPDIR" || true
              echo "临时文件清理完成"
            fi
          }
          trap cleanup EXIT INT TERM

          AMD64_FILE="${TMPDIR}/sing-box-amd64.tar.gz"
          AARCH64_FILE="${TMPDIR}/sing-box-aarch64.pkg.tar.zst"
          WORK_AMD64="${TMPDIR}/build-amd64"
          WORK_AARCH64="${TMPDIR}/build-aarch64"
          mkdir -p "$WORK_AMD64" "$WORK_AARCH64"

          echo "正在下载 x86_64 二进制包..."
          curl -sL --fail --retry 3 --retry-delay 2 \
            -H "User-Agent: ${{ env.UA }}" \
            -o "$AMD64_FILE" "$AMD64_URL"

          echo "正在下载 aarch64 二进制包..."
          curl -sL --fail --retry 3 --retry-delay 2 \
            -H "User-Agent: ${{ env.UA }}" \
            -o "$AARCH64_FILE" "$AARCH64_URL"

          echo "正在解压 x86_64 包..."
          tar -xzf "$AMD64_FILE" -C "$WORK_AMD64" --strip-components=1

          echo "正在解压 aarch64 包..."
          set +e
          tar -xf "$AARCH64_FILE" -C "$WORK_AARCH64" --zstd usr/bin/sing-box 2>/dev/null
          TAR_RC=$?
          set -e
          if [ "$TAR_RC" -ne 0 ] || [ ! -f "${WORK_AARCH64}/usr/bin/sing-box" ]; then
            echo "tar --zstd 解压失败，尝试 zstd 管道方式..."
            mkdir -p "${WORK_AARCH64}/usr/bin"
            # 管道场景：tar 读完所有数据后退出，zstd 在写完数据后才退出，不会触发 SIGPIPE
            zstd -d -c "$AARCH64_FILE" | tar -xf - -C "$WORK_AARCH64" usr/bin/sing-box
          fi

          AMD64_BIN="${WORK_AMD64}/sing-box"
          AARCH64_BIN="${WORK_AARCH64}/usr/bin/sing-box"

          # ELF 头校验：使用 od -An -tx1 替代 xxd -p（ubuntu-latest 默认无 xxd）
          check_elf() {
            local bin_file="$1"
            local arch_name="$2"
            test -f "$bin_file" || { echo "::error::${arch_name} sing-box 二进制文件不存在"; exit 1; }
            # head 作为生产者写完 4 字节即正常退出，od 读完输入退出，无 SIGPIPE 风险
            local magic
            magic="$(head -c 4 "$bin_file" | od -An -tx1 | tr -d ' \n')"
            local class
            class="$(head -c 5 "$bin_file" | tail -c 1 | od -An -tx1 | tr -d ' \n')"
            if [ "$magic" != "7f454c46" ]; then
              echo "::error::${arch_name} 文件 ELF 魔数校验失败: ${magic}"
              exit 1
            fi
            if [ "$class" != "02" ]; then
              echo "::error::${arch_name} 文件不是 64 位 ELF (class=${class})"
              exit 1
            fi
            echo "${arch_name} ELF 校验通过"
          }

          echo "校验 x86_64 ELF 头..."
          check_elf "$AMD64_BIN" "x86_64"
          echo "校验 aarch64 ELF 头..."
          check_elf "$AARCH64_BIN" "aarch64"

          mkdir -p "${{ env.OUT_DIR_AMD64 }}" "${{ env.OUT_DIR_AARCH64 }}"

          echo "清理旧版本 sing-box IPK 文件..."
          find "${{ env.OUT_DIR_AMD64 }}" -maxdepth 1 -type f -name "${{ env.PKG_NAME }}_*.ipk" -delete 2>/dev/null || true
          find "${{ env.OUT_DIR_AARCH64 }}" -maxdepth 1 -type f -name "${{ env.PKG_NAME }}_*.ipk" -delete 2>/dev/null || true
          echo "旧版本清理完成"

          # ---------- IPK 构建函数（外层 tar.gz，内部结构对齐 ipkg-build 规范） ----------
          build_ipk() {
            local ARCH="$1"
            local BIN_SRC="$2"
            local IPK_OUT="$3"
            local IPK_VER="${VER}-${{ env.PKG_RELEASE }}"
            local IPK_TMP="${TMPDIR}/ipk-${ARCH}"

            rm -rf "$IPK_TMP"
            mkdir -p "${IPK_TMP}/data/usr/bin"
            mkdir -p "${IPK_TMP}/control"

            cp "$BIN_SRC" "${IPK_TMP}/data/usr/bin/${{ env.PKG_NAME }}"
            chmod 0755 "${IPK_TMP}/data/usr/bin/${{ env.PKG_NAME }}"

            printf '2.0\n' > "${IPK_TMP}/debian-binary"

            # 生成 control 文件
            local INST_SIZE
            INST_SIZE="$(du -k "${IPK_TMP}/data/usr/bin/${{ env.PKG_NAME }}" | cut -f1)"
            {
              printf 'Package: %s\n' "${{ env.PKG_NAME }}"
              printf 'Version: %s\n' "$IPK_VER"
              printf 'Architecture: %s\n' "$ARCH"
              printf 'Maintainer: OpenWrt Auto Build\n'
              printf 'Installed-Size: %s\n' "$INST_SIZE"
              printf 'Section: net\n'
              printf 'Priority: optional\n'
              printf 'Homepage: https://github.com/SagerNet/sing-box\n'
              printf 'Description: The universal proxy platform\n'
              printf ' sing-box is a universal proxy platform that supports multiple\n'
              printf ' protocols. This package is built automatically via GitHub Actions.\n'
            } > "${IPK_TMP}/control/control"

            # 生成 postinst（使用 printf 避免 heredoc 缩进引发 YAML 解析陷阱）
            printf '#!/bin/sh\n[ -n "$IPKG_INSTROOT" ] || true\nexit 0\n' > "${IPK_TMP}/control/postinst"
            chmod 0755 "${IPK_TMP}/control/postinst"

            # 子 tar 打包：严格按 ( cd dir && tar -czf out.tar.gz . ) 方式，避免路径遗漏
            echo "打包 ${ARCH} data.tar.gz..."
            ( cd "${IPK_TMP}/data" && tar --format=gnu --owner=0 --group=0 -czf "${IPK_TMP}/data.tar.gz" . )

            echo "打包 ${ARCH} control.tar.gz..."
            ( cd "${IPK_TMP}/control" && tar --format=gnu --owner=0 --group=0 -czf "${IPK_TMP}/control.tar.gz" . )

            # 外层打包改用 tar.gz（按要求），内部顺序对齐规范：debian-binary → control → data
            echo "打包 ${ARCH} 最终 IPK (tar.gz 外层)..."
            rm -f "$IPK_OUT"
            ( cd "$IPK_TMP" && tar --owner=0 --group=0 -czf "$IPK_OUT" ./debian-binary ./control.tar.gz ./data.tar.gz )

            echo "${ARCH} IPK 构建完成: ${IPK_OUT}"
          }

          build_ipk "x86_64" "$AMD64_BIN" "$TARGET_IPK_AMD64"
          build_ipk "aarch64" "$AARCH64_BIN" "$TARGET_IPK_AARCH64"

          echo "校验生成的 IPK 完整性..."
          for IPK in "$TARGET_IPK_AMD64" "$TARGET_IPK_AARCH64"; do
            test -f "$IPK" || { echo "::error::IPK 文件缺失: ${IPK}"; exit 1; }
            IPK_SIZE="$(stat -c%s "$IPK")"
            if [ "$IPK_SIZE" -lt 100000 ]; then
              echo "::error::IPK 文件异常过小 (${IPK_SIZE} 字节): ${IPK}"
              exit 1
            fi
            # 外层为 tar.gz，校验 gzip 魔数 1f8b
            GZ_MAGIC="$(head -c 2 "$IPK" | od -An -tx1 | tr -d ' \n')"
            if [ "$GZ_MAGIC" != "1f8b" ]; then
              echo "::error::IPK 不是合法的 gzip 归档 (magic=${GZ_MAGIC}): ${IPK}"
              exit 1
            fi
            # 校验 tar.gz 内部文件列表，确保三个核心部件齐全
            if ! tar -tzf "$IPK" | grep -q '^\./debian-binary$'; then
              echo "::error::IPK 内缺少 debian-binary: ${IPK}"
              exit 1
            fi
            if ! tar -tzf "$IPK" | grep -q '^\./control\.tar\.gz$'; then
              echo "::error::IPK 内缺少 control.tar.gz: ${IPK}"
              exit 1
            fi
            if ! tar -tzf "$IPK" | grep -q '^\./data\.tar\.gz$'; then
              echo "::error::IPK 内缺少 data.tar.gz: ${IPK}"
              exit 1
            fi
            echo "${IPK} 完整性校验通过 (大小: ${IPK_SIZE} 字节)"
          done

          echo "build_success=true" >> "$GITHUB_OUTPUT"
          echo "new_version=${VER}" >> "$GITHUB_OUTPUT"

      - name: 提交新版本到仓库
        if: steps.build.outputs.build_success == 'true'
        shell: bash
        run: |
          set -e
          VER="${{ steps.build.outputs.new_version }}"
          BJ_TIME="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"

          echo "正在提交 sing-box ${VER} 版本文件..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ env.OUT_DIR_AMD64 }}/${{ env.PKG_NAME }}_${VER}-${{ env.PKG_RELEASE }}_x86_64.ipk"
          git add "${{ env.OUT_DIR_AARCH64 }}/${{ env.PKG_NAME }}_${VER}-${{ env.PKG_RELEASE }}_aarch64.ipk"

          if git diff --cached --quiet; then
            echo "无文件变更，跳过提交"
          else
            git commit -m "🔄自动构建 sing-box ${VER} | ${BJ_TIME}(北京时间)"
            git push
            echo "提交并推送成功"
          fi

      - name: 构建结果总结
        shell: bash
        run: |
          if [ "${{ steps.check_skip.outputs.should_skip }}" = "true" ]; then
            echo "本次运行无新版本，未进行构建"
          elif [ "${{ steps.build.outputs.build_success }}" = "true" ]; then
            echo "sing-box ${{ steps.build.outputs.new_version }} 版本 IPK 构建并推送成功！"
            echo "  - x86_64: ${{ steps.check_skip.outputs.ipk_amd64 }}"
            echo "  - aarch64: ${{ steps.check_skip.outputs.ipk_aarch64 }}"
          else
            echo "构建步骤未执行（可能被跳过或失败）"
          fi
