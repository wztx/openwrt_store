# ============================================================
# 工作流名称：sing-box 版本同步
# 功能说明：定时检查 SagerNet/sing-box 上游最新版本（含预发布版），
#           下载 OpenWrt 24.10 对应架构的 ipk 包并同步到本仓库
# 触发方式：每天 UTC 0:00（北京时间 08:00）定时触发 + 手动触发（支持强制更新）
# 适用环境：OpenWrt 24.10，架构 x86_64 / aarch64_generic
# ============================================================

name: 自动更新 sing-box IPK 软件包

on:
  # 定时触发：每天 UTC 22:05（北京时间 06:05）
  schedule:
    - cron: '5 22 * * *'

  # 手动触发：支持强制更新参数
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制重新构建（忽略本地已存在的同名文件，默认否）'
        required: false
        type: boolean
        default: false

# 并发限制：同一分支同一工作流只允许一个实例运行，排队等待
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 授予工作流所需的最小权限
permissions:
  contents: write

jobs:
  # ----------------------------------------------------------
  # 任务：同步 sing-box 最新版本到仓库
  # ----------------------------------------------------------
  sync-sing-box:
    name: 同步 sing-box 版本
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # --------------------------------------------------------
      # 步骤 1：检出仓库代码
      # --------------------------------------------------------
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # --------------------------------------------------------
      # 步骤 2：配置 Git 用户信息
      # --------------------------------------------------------
      - name: 配置 Git 环境
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --------------------------------------------------------
      # 步骤 3：获取上游最新版本信息（含预发布版）
      # 说明：不使用 /latest 接口，直接获取 releases 列表第一个
      #       即最新发布（包括 prerelease 预发布版）
      # --------------------------------------------------------
      - name: 获取上游最新版本信息
        id: get_version
        env:
          UA_HEADER: "Mozilla/5.0 (compatible; sing-box-sync-bot/1.0)"
        run: |
          echo "正在获取上游最新版本信息（含预发布版）..."

          # 调用 GitHub API 获取 releases 列表（按发布时间倒序，第一个即为最新）
          RELEASES_JSON=$(curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: ${UA_HEADER}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=1")

          # 检查 API 返回是否正常
          if [ -z "${RELEASES_JSON}" ] || echo "${RELEASES_JSON}" | grep -q '"message"'; then
            echo "::error::获取版本信息失败，API 返回异常"
            echo "API 返回内容：${RELEASES_JSON}"
            exit 1
          fi

          # 提取版本标签（如 v1.12.0-beta.1 或 v1.11.0）
          TAG_NAME=$(echo "${RELEASES_JSON}" | jq -r '.[0].tag_name')
          # 提取发布名称
          RELEASE_NAME=$(echo "${RELEASES_JSON}" | jq -r '.[0].name')
          # 是否为预发布版
          IS_PRERELEASE=$(echo "${RELEASES_JSON}" | jq -r '.[0].prerelease')
          # 发布时间
          PUBLISHED_AT=$(echo "${RELEASES_JSON}" | jq -r '.[0].published_at')

          if [ -z "${TAG_NAME}" ] || [ "${TAG_NAME}" = "null" ]; then
            echo "::error::解析版本标签失败"
            exit 1
          fi

          echo "最新版本标签：${TAG_NAME}"
          echo "发布名称：${RELEASE_NAME}"
          echo "是否预发布版：${IS_PRERELEASE}"
          echo "发布时间：${PUBLISHED_AT}"

          # 构造两个架构对应的目标文件名（实际命名含 _openwrt_ 段）
          VER_NO_V="${TAG_NAME#v}"
          FILE_X86="sing-box_${VER_NO_V}_openwrt_x86_64.ipk"
          FILE_AARCH64="sing-box_${VER_NO_V}_openwrt_aarch64_generic.ipk"

          echo "x86_64 目标文件名：${FILE_X86}"
          echo "aarch64_generic 目标文件名：${FILE_AARCH64}"

          # 输出变量供后续步骤使用
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "ver_no_v=${VER_NO_V}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "file_x86=${FILE_X86}" >> "$GITHUB_OUTPUT"
          echo "file_aarch64=${FILE_AARCH64}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # 步骤 4：检查本地是否已存在该版本文件（纯文件名对比）
      # 说明：如果两个目标文件都已存在且非强制更新，则跳过
      # --------------------------------------------------------
      - name: 检查本地版本文件
        id: check_local
        run: |
          FORCE="${{ github.event.inputs.force_update }}"
          FILE_X86="${{ steps.get_version.outputs.file_x86 }}"
          FILE_AARCH64="${{ steps.get_version.outputs.file_aarch64 }}"

          # 目标目录路径（注意：aarch64_generic 对应 run/aarch64/sing-box）
          DIR_X86="run/x86_64/sing-box"
          DIR_AARCH64="run/aarch64/sing-box"

          X86_EXISTS="false"
          AARCH64_EXISTS="false"

          if [ -f "${DIR_X86}/${FILE_X86}" ]; then
            X86_EXISTS="true"
            echo "x86_64 文件已存在：${DIR_X86}/${FILE_X86}"
          else
            echo "x86_64 文件不存在：${DIR_X86}/${FILE_X86}"
          fi

          if [ -f "${DIR_AARCH64}/${FILE_AARCH64}" ]; then
            AARCH64_EXISTS="true"
            echo "aarch64 文件已存在：${DIR_AARCH64}/${FILE_AARCH64}"
          else
            echo "aarch64 文件不存在：${DIR_AARCH64}/${FILE_AARCH64}"
          fi

          # 判断是否需要更新
          if [ "${FORCE}" = "true" ]; then
            echo "检测到强制更新参数，将重新下载所有文件"
            NEED_UPDATE="true"
          elif [ "${X86_EXISTS}" = "true" ] && [ "${AARCH64_EXISTS}" = "true" ]; then
            echo "两个架构的版本文件均已存在，无需更新"
            NEED_UPDATE="false"
          else
            echo "有文件缺失，需要下载更新"
            NEED_UPDATE="true"
          fi

          echo "x86_exists=${X86_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "aarch64_exists=${AARCH64_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "need_update=${NEED_UPDATE}" >> "$GITHUB_OUTPUT"
          echo "dir_x86=${DIR_X86}" >> "$GITHUB_OUTPUT"
          echo "dir_aarch64=${DIR_AARCH64}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # 步骤 5：创建临时下载目录
      # --------------------------------------------------------
      - name: 创建临时下载目录
        if: steps.check_local.outputs.need_update == 'true'
        run: |
          mkdir -p /tmp/sing-box-download
          echo "临时目录已创建：/tmp/sing-box-download"

      # --------------------------------------------------------
      # 步骤 6：下载新版本 ipk 文件
      # --------------------------------------------------------
      - name: 下载新版本 ipk 文件
        if: steps.check_local.outputs.need_update == 'true'
        env:
          UA_HEADER: "Mozilla/5.0 (compatible; sing-box-sync-bot/1.0)"
        run: |
          TAG="${{ steps.get_version.outputs.tag_name }}"
          FILE_X86="${{ steps.get_version.outputs.file_x86 }}"
          FILE_AARCH64="${{ steps.get_version.outputs.file_aarch64 }}"
          TMP_DIR="/tmp/sing-box-download"

          # 构造下载基础 URL
          BASE_URL="https://github.com/SagerNet/sing-box/releases/download/${TAG}"

          echo "开始下载文件，基础URL：${BASE_URL}"

          # 下载 x86_64 版本
          if [ "${{ steps.check_local.outputs.x86_exists }}" != "true" ] || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "正在下载 x86_64 版本：${FILE_X86}"
            curl -fsSL -L \
              -H "User-Agent: ${UA_HEADER}" \
              -o "${TMP_DIR}/${FILE_X86}" \
              "${BASE_URL}/${FILE_X86}"
            if [ $? -ne 0 ] || [ ! -s "${TMP_DIR}/${FILE_X86}" ]; then
              echo "::error::下载 x86_64 文件失败"
              exit 1
            fi
            echo "x86_64 文件下载完成，大小：$(du -h "${TMP_DIR}/${FILE_X86}" | cut -f1)"
          fi

          # 下载 aarch64_generic 版本
          if [ "${{ steps.check_local.outputs.aarch64_exists }}" != "true" ] || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "正在下载 aarch64_generic 版本：${FILE_AARCH64}"
            curl -fsSL -L \
              -H "User-Agent: ${UA_HEADER}" \
              -o "${TMP_DIR}/${FILE_AARCH64}" \
              "${BASE_URL}/${FILE_AARCH64}"
            if [ $? -ne 0 ] || [ ! -s "${TMP_DIR}/${FILE_AARCH64}" ]; then
              echo "::error::下载 aarch64_generic 文件失败"
              exit 1
            fi
            echo "aarch64_generic 文件下载完成，大小：$(du -h "${TMP_DIR}/${FILE_AARCH64}" | cut -f1)"
          fi

          echo "所有文件下载完成"
          ls -la "${TMP_DIR}/"

      # --------------------------------------------------------
      # 步骤 7：确保目标目录存在
      # --------------------------------------------------------
      - name: 创建目标目录
        if: steps.check_local.outputs.need_update == 'true'
        run: |
          DIR_X86="${{ steps.check_local.outputs.dir_x86 }}"
          DIR_AARCH64="${{ steps.check_local.outputs.dir_aarch64 }}"
          mkdir -p "${DIR_X86}" "${DIR_AARCH64}"
          echo "目标目录已就绪：${DIR_X86}、${DIR_AARCH64}"

      # --------------------------------------------------------
      # 步骤 8：安全清理旧版本文件
      # 说明：仅精确删除各目录下 sing-box_*_x86_64.ipk 和
      #       sing-box_*_aarch64_generic.ipk 模式的文件，
      #       不触碰其他任何文件，防止误删
      # --------------------------------------------------------
      - name: 清理旧版本文件
        if: steps.check_local.outputs.need_update == 'true'
        run: |
          DIR_X86="${{ steps.check_local.outputs.dir_x86 }}"
          DIR_AARCH64="${{ steps.check_local.outputs.dir_aarch64 }}"

          echo "开始清理旧版本文件..."

          # 安全清理 x86_64 目录下的旧 sing-box ipk
          # 使用精确 glob 匹配：sing-box_*_openwrt_x86_64.ipk
          # 先列出将要删除的文件，确认后再删除
          echo "x86_64 目录下待清理的文件："
          X86_OLD_COUNT=0
          if ls "${DIR_X86}"/sing-box_*_openwrt_x86_64.ipk 1>/dev/null 2>&1; then
            for f in "${DIR_X86}"/sing-box_*_openwrt_x86_64.ipk; do
              # 防御性检查：确保文件名确实匹配 sing-box 开头、.ipk 结尾
              if [ -f "$f" ] && [[ "$(basename "$f")" =~ ^sing-box_.*_openwrt_x86_64\.ipk$ ]]; then
                echo "  删除：$f"
                rm -f "$f"
                X86_OLD_COUNT=$((X86_OLD_COUNT + 1))
              fi
            done
          else
            echo "  （无旧文件）"
          fi
          echo "已清理 x86_64 旧文件数：${X86_OLD_COUNT}"

          # 安全清理 aarch64 目录下的旧 sing-box ipk
          echo "aarch64 目录下待清理的文件："
          AARCH64_OLD_COUNT=0
          if ls "${DIR_AARCH64}"/sing-box_*_openwrt_aarch64_generic.ipk 1>/dev/null 2>&1; then
            for f in "${DIR_AARCH64}"/sing-box_*_openwrt_aarch64_generic.ipk; do
              if [ -f "$f" ] && [[ "$(basename "$f")" =~ ^sing-box_.*_openwrt_aarch64_generic\.ipk$ ]]; then
                echo "  删除：$f"
                rm -f "$f"
                AARCH64_OLD_COUNT=$((AARCH64_OLD_COUNT + 1))
              fi
            done
          else
            echo "  （无旧文件）"
          fi
          echo "已清理 aarch64 旧文件数：${AARCH64_OLD_COUNT}"

          echo "旧版本文件清理完成"

      # --------------------------------------------------------
      # 步骤 9：将新文件移动到目标目录
      # --------------------------------------------------------
      - name: 部署新版本文件到仓库
        if: steps.check_local.outputs.need_update == 'true'
        run: |
          TMP_DIR="/tmp/sing-box-download"
          DIR_X86="${{ steps.check_local.outputs.dir_x86 }}"
          DIR_AARCH64="${{ steps.check_local.outputs.dir_aarch64 }}"

          echo "将新文件部署到仓库目录..."

          if [ -f "${TMP_DIR}/${{ steps.get_version.outputs.file_x86 }}" ]; then
            cp -f "${TMP_DIR}/${{ steps.get_version.outputs.file_x86 }}" "${DIR_X86}/"
            echo "已部署 x86_64：${DIR_X86}/${{ steps.get_version.outputs.file_x86 }}"
          fi

          if [ -f "${TMP_DIR}/${{ steps.get_version.outputs.file_aarch64 }}" ]; then
            cp -f "${TMP_DIR}/${{ steps.get_version.outputs.file_aarch64 }}" "${DIR_AARCH64}/"
            echo "已部署 aarch64：${DIR_AARCH64}/${{ steps.get_version.outputs.file_aarch64 }}"
          fi

          echo "文件部署完成，验证目标目录："
          ls -la "${DIR_X86}/"
          echo "---"
          ls -la "${DIR_AARCH64}/"

      # --------------------------------------------------------
      # 步骤 10：提交并推送到仓库
      # --------------------------------------------------------
      - name: 提交并推送新版本
        if: steps.check_local.outputs.need_update == 'true'
        id: commit
        run: |
          TAG="${{ steps.get_version.outputs.tag_name }}"
          VER="${{ steps.get_version.outputs.ver_no_v }}"
          IS_PRERELEASE="${{ steps.get_version.outputs.is_prerelease }}"

          # 获取北京时间（UTC+8）
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          # 构造提交信息
          if [ "${IS_PRERELEASE}" = "true" ]; then
            COMMIT_MSG="🔄自动更新 sing-box ${VER} (预发布版) | ${BEIJING_TIME} (北京时间)"
          else
            COMMIT_MSG="🔄自动更新 sing-box ${VER} (正式版) | ${BEIJING_TIME} (北京时间)"
          fi

          echo "提交信息：${COMMIT_MSG}"

          # 添加目标目录文件
          DIR_X86="${{ steps.check_local.outputs.dir_x86 }}"
          DIR_AARCH64="${{ steps.check_local.outputs.dir_aarch64 }}"
          git add "${DIR_X86}/" "${DIR_AARCH64}/"

          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "没有文件变更，跳过提交"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "${COMMIT_MSG}"
            git push
            echo "提交并推送成功"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------
      # 步骤 11：输出同步结果摘要
      # --------------------------------------------------------
      - name: 输出同步结果
        if: always()
        run: |
          TAG="${{ steps.get_version.outputs.tag_name }}"
          NEED_UPDATE="${{ steps.check_local.outputs.need_update }}"
          HAS_CHANGES="${{ steps.commit.outputs.has_changes }}"

          echo "==================== 同步结果摘要 ===================="
          echo "上游最新版本：${TAG:-未知}"
          if [ "${NEED_UPDATE}" = "true" ]; then
            if [ "${HAS_CHANGES}" = "true" ]; then
              echo "同步状态：新版本已推送"
            else
              echo "同步状态：无文件变更（可能与现有版本一致）"
            fi
          else
            echo "同步状态：本地已是最新版本，无需更新"
          fi
          echo "======================================================"

      # --------------------------------------------------------
      # 步骤 12：清理临时文件（无论成功失败都执行）
      # --------------------------------------------------------
      - name: 清理临时文件
        if: always()
        run: |
          TMP_DIR="/tmp/sing-box-download"
          if [ -d "${TMP_DIR}" ]; then
            rm -rf "${TMP_DIR}"
            echo "临时文件目录已清理：${TMP_DIR}"
          else
            echo "临时目录不存在，无需清理"
          fi
